<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F12719" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#FF2B17" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("mr:theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Santiago Rossi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;600&family=Familjen+Grotesk:wght@400;600&family=Figtree:wght@500;700;800&family=Unbounded:wght@800&family=Instrument+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,400&family=Pinyon+Script&display=swap">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/logo-smr-180.png">
<style>
/* Piel Tabloide: papel de diario, titulares Anton, etiquetas Archivo condensadas, tarjetas planas sin radio.
   Cinta roja arriba y navegación en cajas. Oscuro: negro, crema y la nube roja del escudo. Claro: papel y tinta.
   El rojo es lo urgente y la acción; el verde, solo lo positivo. Categorías y gráficos usan la paleta del escudo
   (mostaza, naranja, rojo, marrón), no la magenta/lila/teal de la piel Nike. */
:root{
  color-scheme: light;
  --bg:#F2EEE6; --card:#EAE4D8; --ink:#0B0B0B; --ink2:#2B2925; --sec:#625D55; --ter:#8C877D;
  --sep:#DCD5C7; --sep2:#C2BAAA; --fill:#E4DDCF; --fill2:#D8D0C0;
  --blue:#0B0B0B; --blue-ink:#0B0B0B; --green:#0A7038; --green-f:#0B7A3E; --orange:#C45A18; --orange-ink:#C45A18;
  --red:#B4311E; --red-f:#B4311E; --purple:#8A5A3A; --indigo:#0B0B0B;
  --acc:#F12719; --acc-ink:#0B0B0B; --cloud:241,39,25; --cloudA:.72;
  --on-ink:#F2EEE6; --hero:var(--card); --hero-ink:var(--ink); --hero-sec:var(--sec);
  --void:#F2EEE6; --ice:var(--ink); --mist:var(--sec); --dim:var(--ter); --prizm:var(--ink); --prizm-soft:#E4DDCF;
  --mustard:#9A7418; --stone:#8A5A3A; --crit:var(--red); --good:var(--green); --warn:#0B0B0B; --frost:#8A5A3A;
  --line:var(--sep); --line-hi:var(--sep2);
  --f:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fd:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fx:"Anton","Bebas Neue","Impact","Arial Narrow Bold",sans-serif;
  --fl:"Archivo","Arial Narrow",Arial,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:0px; --rs:0px; --pill:0px; --gut:clamp(16px,3vw,48px);
  --shadow:none; --glass:#F2EEE6; --glass-edge:inset 0 -1px 0 var(--sep);
  --raised:#0B0B0B; --rail-bg:var(--bg); --top-bg:var(--acc); --sheet:#F2EEE6; --tcbg:transparent;
  --hover:#ECE6DA; --toast:#0B0B0B; --g:11,11,11;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#0B0B0B; --card:#141414; --ink:#F4F1EA; --ink2:#D9D5CC; --sec:#9A968E; --ter:#716D66;
  --sep:#262626; --sep2:#3A3A3A; --fill:#1A1A1A; --fill2:#262626;
  --blue:#F4F1EA; --blue-ink:#F4F1EA; --green:#3DDC84; --green-f:#3DDC84; --orange:#E07A2F; --orange-ink:#FF3B26;
  --red:#FF3B26; --red-f:#FF3B26; --acc:#FF2B17; --acc-ink:#0B0B0B; --cloud:255,43,23; --cloudA:.95; --on-ink:#0B0B0B;
  --mustard:#E0A526; --stone:#C4A484;
  --void:#141414; --prizm-soft:#1A1A1A; --rail-bg:#0B0B0B; --sheet:#111111; --hover:#121212; --warn:#F4F1EA;
  --toast:#F4F1EA; --g:244,241,234; --glass:#0B0B0B; --glass-edge:inset 0 -1px 0 #262626; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0B0B0B; --card:#141414; --ink:#F4F1EA; --ink2:#D9D5CC; --sec:#9A968E; --ter:#716D66;
  --sep:#262626; --sep2:#3A3A3A; --fill:#1A1A1A; --fill2:#262626;
  --blue:#F4F1EA; --blue-ink:#F4F1EA; --green:#3DDC84; --green-f:#3DDC84; --orange:#E07A2F; --orange-ink:#FF3B26;
  --red:#FF3B26; --red-f:#FF3B26; --acc:#FF2B17; --acc-ink:#0B0B0B; --cloud:255,43,23; --cloudA:.95; --on-ink:#0B0B0B;
  --mustard:#E0A526; --stone:#C4A484;
  --void:#141414; --prizm-soft:#1A1A1A; --rail-bg:#0B0B0B; --sheet:#111111; --hover:#121212; --warn:#F4F1EA;
  --toast:#F4F1EA; --g:244,241,234; --glass:#0B0B0B; --glass-edge:inset 0 -1px 0 #262626; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.num,td.m,b{font-variant-numeric:tabular-nums}
.gate[hidden],[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra utilitaria + navegación ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.util{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-height:40px;padding:calc(4px + env(safe-area-inset-top,0px)) var(--gut) 4px;background:var(--top-bg);font-size:12px;font-weight:500}
.util .grow{flex:1}
.tcinfo{display:inline-flex;align-items:baseline;gap:6px;color:var(--ink)}
.tcinfo #tclbl,.tcinfo #tcsrc{color:var(--sec)}
.tcinfo b{font-size:13px;font-weight:600}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;height:64px;padding:0 var(--gut);background:var(--rail-bg);box-shadow:inset 0 -1px 0 var(--sep)}
.brandmark{display:flex;align-items:center;gap:10px;flex:none;color:var(--ink);text-decoration:none}
.brandmark img{display:block;height:40px;width:auto}
.brandmark span{font:400 22px/1 var(--fx);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.rail{flex:1;display:flex;justify-content:center;gap:0;min-width:0}
@media (max-width:1240px) and (min-width:901px){.rail button{font-size:15px;padding:0 8px}.rail button::after{left:8px;right:8px}}
.rail button{position:relative;display:inline-flex;align-items:center;gap:6px;height:64px;padding:0 10px;border:0;background:none;color:var(--ink);font-size:16px;font-weight:500;white-space:nowrap}
.rail button svg{display:none}
.rail button::after{content:"";position:absolute;left:12px;right:12px;bottom:14px;height:2px;background:var(--ink);transform:scaleX(0);transition:transform .2s}
.rail button:hover::after{transform:scaleX(.6)}
.rail button[aria-current="page"]::after{transform:scaleX(1)}
.rail button .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:inline-grid;place-items:center}
.rail button .badge:empty{display:none}
.nav .btn{flex:none}

.main{flex:1;min-width:0;width:100%;max-width:1440px;margin:0 auto;padding-inline:var(--gut);padding-block:0 64px}
.hud{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;padding-block:40px 20px}
.brand h1{margin:0;font:400 clamp(48px,8vw,112px)/.88 var(--fx);text-transform:uppercase;letter-spacing:-.005em;overflow-wrap:anywhere}
.brand p{margin:10px 0 0;color:var(--sec);font-size:16px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border:0;border-radius:var(--pill);background:var(--bg);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ter)}
.chip.live .dot{background:var(--green-f)}
.chip.busy .dot{background:var(--ink)}
.chip.bad{color:var(--red)}.chip.bad .dot{background:var(--red)}
.chip.demo .dot{background:var(--red)}
.seg{display:inline-flex;gap:4px}
.seg button{height:28px;padding:0 14px;border:1px solid var(--sep2);border-radius:var(--pill);background:var(--bg);font-size:12px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

/* meses: tira de filtros */
.scale{display:flex;gap:8px;overflow-x:auto;padding:4px 0 24px;scrollbar-width:none}
.scale::-webkit-scrollbar{display:none}
.scale button{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--sep2);border-radius:var(--pill);background:var(--bg);color:var(--ink);font-size:14px;font-weight:500}
.scale .alt{width:6px;height:18px;display:flex;align-items:flex-end;border-radius:3px;overflow:hidden;background:var(--fill2)}
.scale .alt b{display:block;width:100%;background:var(--ter)}
.scale .alt b.ok{background:var(--green-f)}.scale .alt b.low{background:var(--red)}
.scale span{text-transform:capitalize}
.scale button:hover{border-color:var(--ink)}
.scale button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.scale button[aria-pressed="true"] .alt{background:color-mix(in srgb,var(--on-ink) 30%,transparent)}
.scale .all .alt{display:none}
.scale .all span:first-child{display:none}

/* ---------- bloque de campaña ---------- */
.camp{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;margin-bottom:48px;padding:clamp(28px,4vw,56px);background:var(--hero);color:var(--hero-ink);overflow:hidden}
.camp .eyebrow{font-size:14px;font-weight:500;color:var(--hero-sec);margin-bottom:12px}
.camp h2{margin:0;font:400 clamp(44px,10.5vw,136px)/.88 var(--fx);text-transform:uppercase;letter-spacing:-.005em;overflow-wrap:anywhere}
.camp h2 em{font-style:normal;color:var(--hero-sec)}
.camp p{margin:16px 0 0;max-width:56ch;font-size:16px;color:var(--hero-sec)}
.camp .btn{background:var(--hero-ink);color:var(--hero)}
.camp .btn:hover{background:var(--hero-ink);opacity:.85}
.camp .stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:28px}
.camp .stats div{display:grid;gap:2px}
.camp .stats span{font-size:12px;color:var(--hero-sec)}
.camp .stats b{font-size:20px;font-weight:600}
@media (max-width:700px){.camp{grid-template-columns:minmax(0,1fr)}}

/* ---------- tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px}
.panel{position:relative;min-width:0;padding:24px;background:var(--card)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.ph h2{margin:0;font:500 20px/1.2 var(--fd);text-transform:uppercase;letter-spacing:.01em}
.ph .meta{font-size:14px;font-weight:500;color:var(--sec)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1180px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.big{font:400 56px/.95 var(--fx);letter-spacing:0}
.lbl{font-size:14px;font-weight:500;color:var(--sec)}
.sub{font-size:14px;color:var(--sec)}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--red)}.pz{color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;min-height:180px}
.kpi .v{font:400 48px/1 var(--fx);letter-spacing:0}
.kpi svg{width:100%;height:46px;display:block}
.kpi .foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:500;color:var(--sec)}
.kpi.link{cursor:pointer}
.kpi.link:hover{background:var(--fill2)}
@media (max-width:560px){.kpis{grid-template-columns:minmax(0,1fr)}}

.gauge-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
.gauge svg{width:100%;max-width:220px;display:block;margin-inline:auto}
.gstats{display:grid;gap:14px}
.gstats div{display:grid;gap:0}
.gstats b{font:400 30px/1.05 var(--fx)}
@media (max-width:560px){.gauge-wrap{grid-template-columns:minmax(0,1fr)}}

.chart svg{width:100%;height:auto;display:block}
.wide{min-width:560px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;font-weight:500;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed var(--ink);width:16px;vertical-align:4px;border-radius:0}

/* libro de retiros */
.libro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;align-items:start}
.lh{display:grid;gap:8px;padding:24px;background:var(--bg)}
.lh p{margin:0;font-size:15px;color:var(--ink2)}
.lh dl{display:grid;gap:10px;margin:8px 0 0;padding-top:14px;border-top:1px solid var(--sep2)}
.lh dl div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.lh dt{color:var(--sec)}.lh dd{margin:0;font-weight:600}
.lh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seal{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:var(--pill);background:var(--red);color:#fff;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.seal.ok{background:var(--green)}
table.lib tbody tr{cursor:pointer}
table.lib tr.sel td{background:var(--bg)}
table.lib tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
table.lib tr.now td:first-child::after{content:"EN CURSO";margin-left:8px;padding:2px 8px;border-radius:var(--pill);background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:600;letter-spacing:.04em}
table.lib tfoot td{border-top:1px solid var(--ink);border-bottom:0;font-weight:700}
.dv{position:relative;display:block;height:6px;min-width:90px;background:var(--fill2)}
.dv::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink)}
.dv i{position:absolute;top:0;bottom:0}
.dv i.p{left:50%;background:var(--green-f)}.dv i.n{right:50%;background:var(--red)}
@media (max-width:900px){.libro{grid-template-columns:minmax(0,1fr)}}

.cstack{display:flex;gap:2px;height:14px;margin:2px 0 14px}
.cstack i{display:block;height:100%;min-width:2px}
.gctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media (min-width:600px){.cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.cd{display:grid;gap:4px;align-content:start;padding:16px;border:2px solid transparent;background:var(--bg);color:var(--ink);text-align:left}
.cd:hover{border-color:var(--sep2)}
.cd[aria-pressed="true"]{border-color:var(--ink)}
.cd .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.cd .nm i{flex:none;width:10px;height:10px;border-radius:50%}
.cd .big{font:400 30px/1 var(--fx);font-variant-numeric:tabular-nums;margin-top:2px}
@media (max-width:600px){.cd{padding:14px}.cd .big{font-size:24px;white-space:nowrap}}
.cd .sub{font-size:13px;line-height:1.35;color:var(--sec)}
.cd .mini{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:6px}
.cd .mini u{flex:1;min-height:2px;background:var(--sep2);text-decoration:none}
.cd .mini u.on{background:var(--ink)}
.cd .mx{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--sec)}
.cd .dl{font-weight:600}.cd .dl.up{color:var(--red)}.cd .dl.dn{color:var(--green)}
.cat-r{display:grid;grid-template-columns:10px minmax(0,1fr) auto 40px;gap:10px;align-items:center;width:100%;break-inside:avoid;padding:9px 6px;border:0;border-top:1px solid var(--sep);background:none;color:var(--ink);font-size:14px;font-weight:500;text-align:left}
.cat-r .d{width:10px;height:10px;border-radius:50%}
.cat-r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-r b{font-weight:600;text-align:right}
.cat-r small{font-size:12px;color:var(--sec);text-align:right}
.cat-r.sm{grid-template-columns:10px minmax(0,1fr) auto 40px;padding:7px 0}
.eye{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--sep2);border-radius:var(--pill);background:var(--bg);font-size:12px;font-weight:500;color:var(--ink)}
.eye svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .sl{display:none}
.eye[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.eye[aria-pressed="true"] .sl{display:block}
@media (pointer:coarse){.eye{min-height:36px}}

.signals{display:grid;gap:0}
.sig{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--sep2)}
.sig:first-child{border-top:0;padding-top:4px}
.sig .bar{width:10px;height:10px;border-radius:50%;background:var(--ter)}
.sig.warn .bar,.sig.crit .bar{background:var(--red)}.sig.ok .bar{background:var(--green-f)}.sig.info .bar{background:var(--ink)}
.sig p{margin:0;font-size:16px;font-weight:500;line-height:1.35}
.sig small{display:block;color:var(--sec);font-size:14px;font-weight:400;margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border:0;border-radius:var(--pill);background:var(--fill2);color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap;transition:transform .12s,opacity .12s,background .15s}
.btn:hover{background:var(--sep2)}
.btn:active{transform:scale(.96);opacity:.7}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.primary:hover{background:var(--ink2)}
.btn.ghost{background:none;padding:0 10px;text-decoration:underline;text-underline-offset:3px}
.btn.ghost:hover{background:none;opacity:.7}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel .btn:not(.primary):not(.ghost){background:var(--bg)}
.panel .btn:not(.primary):not(.ghost):hover{background:var(--fill2)}

.saldos{display:grid;gap:0}
.saldos div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--sep2);font-weight:500}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.rate div{display:grid;gap:2px}
.rate b{font:400 28px/1 var(--fx)}

.bar-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.bar-row .l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills .pill{flex:none}
@media (max-width:600px){.bar-row .l.pills{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}.bar-row .l.pills::-webkit-scrollbar{display:none}.bar-row .search{width:100%}}
.pill{height:40px;padding:0 18px;border:1px solid var(--sep2);border-radius:var(--pill);background:var(--bg);font-size:14px;font-weight:500;color:var(--ink)}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.search{height:40px;width:min(280px,100%);padding:0 18px;border:1px solid var(--sep2);border-radius:0;background:var(--bg);font-size:15px}
.search:focus{outline:none;box-shadow:0 0 0 2px var(--ink)}
.search::placeholder{color:var(--sec)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}
.strip .panel{padding:20px 24px}

.lbl,.ph .meta,th,.camp .eyebrow,.src,.camp .stats span,.lh dt,.cd .mx,.alloc-key,.pend-m h3{font-family:var(--fl);font-stretch:78%;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.ph h2{font:400 28px/1 var(--fx);text-transform:uppercase;letter-spacing:.01em}
.panel{border:1px solid var(--sep)}
.camp{border:1px solid var(--sep);border-top:4px solid var(--acc)}
.camp .btn{background:var(--ink);color:var(--bg)}
.camp .btn:hover{background:var(--ink);opacity:.85}
.camp .up{color:var(--green)}.camp .down,.camp .warn-t{color:var(--red)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{background:var(--acc);filter:brightness(1.08)}
.btn{font-family:var(--fl);font-stretch:80%;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.btn.ghost{text-transform:none;letter-spacing:0;font-family:var(--f);font-stretch:100%;font-weight:500}
.pill,.tag,.seg button,.scale button{font-family:var(--fl);font-stretch:80%;font-weight:700;letter-spacing:.06em}
.subtabs button[aria-current="page"]::after{background:var(--acc)}
.trail .tick.cur span{background:var(--acc);color:#0B0B0B}
.seal{font-family:var(--fl);font-stretch:80%;font-weight:700}
.cats div.cur{background:var(--ink);color:var(--bg)}
@media (max-width:1180px){.rail{gap:4px;padding-bottom:8px}.rail button{height:36px;font-size:12px}}

/* ---------- Resumen: portada viva (nube de puntos del escudo SMR) ---------- */
.vivo{position:relative;min-height:clamp(560px,74vh,700px);margin:0 0 0;border:1px solid var(--sep);border-bottom:0;overflow:hidden;background:var(--bg)}
.vivo canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vivo .vc{position:absolute;display:grid;gap:2px;max-width:42%;z-index:1}
.vivo .vc .lbl{display:inline-flex;align-items:center;gap:7px}
.vivo .vc b{font:400 clamp(30px,3.4vw,46px)/1 var(--fx);font-variant-numeric:tabular-nums}
.vivo .vc small{font-size:13px;color:var(--sec)}
.vivo .tl{left:28px;top:26px}.vivo .tr{right:28px;top:26px;text-align:right;justify-items:end}
.vivo .ml{left:28px;top:168px}.vivo .mr{right:28px;top:168px;text-align:right;justify-items:end}
.vivo .vc.link{cursor:pointer}
.vivo .vc.link:hover b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.vivo .latido{width:7px;height:7px;border-radius:50%;background:var(--green-f);animation:latido 2s infinite}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(61,220,132,.5)}60%{box-shadow:0 0 0 7px rgba(61,220,132,0)}}
.vivo .tit{position:absolute;left:28px;bottom:28px;max-width:64%;z-index:1}
.vivo .tit .k{font:700 13px/1 var(--fl);font-stretch:78%;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.vivo .tit .k.ok{color:var(--green)}
.vivo .tit h2{margin:10px 0 14px;font:400 clamp(64px,10vw,160px)/.82 var(--fx);white-space:nowrap;font-variant-numeric:tabular-nums}
.vivo .tit p{margin:0;max-width:60ch;font-size:17px;color:var(--sec)}
.vivo .tit p b{color:var(--ink);font-weight:700}
.vivo .bar2{position:relative;height:6px;margin-top:16px;max-width:520px;background:var(--fill2)}
.vivo .bar2 i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.vivo .bar2 em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--red)}
.vivo .alr{position:absolute;right:28px;bottom:28px;width:300px;padding:14px 16px;border:2px solid var(--sep2);background:color-mix(in srgb,var(--bg) 82%,transparent);z-index:1;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.vivo .alr.crit{border-color:var(--red);transform:rotate(2deg)}
.vivo .alr.crit .lbl,.vivo .alr.crit b{color:var(--red)}
.vivo .alr b{display:block;margin:6px 0;font:400 58px/.9 var(--fx)}
.vivo .alr p{margin:0;font-size:13.5px;line-height:1.4}
.cinta{overflow:hidden;white-space:nowrap;background:var(--acc);color:#0B0B0B;border:1px solid var(--acc)}
.cinta .pista{display:inline-flex;gap:44px;padding:10px 0;animation:cinta 46s linear infinite;font:700 13px/1 var(--fl);font-stretch:78%;letter-spacing:.1em;text-transform:uppercase}
.cinta .pista span::before{content:"■  "}
@keyframes cinta{to{transform:translateX(-50%)}}
.pulso{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding:28px;border:1px solid var(--sep);border-top:0;background:var(--card)}
.pulso h3{margin:6px 0 10px;font:400 44px/.92 var(--fx);text-transform:uppercase}
.pulso p{margin:0;font-size:13px;color:var(--sec)}
.pcols{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;align-items:end;height:260px;padding-top:18px}
.pcol{position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:4px;height:100%;padding:0;border:0;background:none;color:var(--ink);cursor:pointer}
.pcol .d{width:12px;height:7px;background:var(--ink)}
.pcol.cur .d{background:var(--red)}
.pcol.cur .d:last-of-type{animation:parpadeo 1.2s infinite}
.pcol.sel .m{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.pcol .m{order:-1;margin-top:6px;font:700 12px/1 var(--fl);font-stretch:78%;letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.pcol .t{position:absolute;bottom:100%;font:600 12px/1 var(--fm);white-space:nowrap;opacity:0;transition:opacity .2s;background:var(--ink);color:var(--bg);padding:3px 6px}
.pcol:hover .t,.pcol:focus-visible .t{opacity:1}
.pcol .mas{font:700 12px/1 var(--fl);color:var(--sec)}
.pulso .obj{position:absolute;left:-6px;right:-6px;border-top:1.5px dashed var(--red);pointer-events:none}
.pulso .obj span{position:absolute;right:0;top:-17px;font:700 10.5px/1 var(--fl);font-stretch:78%;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.vivo-anim .pcol .d{animation:dotIn .35s both}
@keyframes dotIn{from{opacity:0;transform:translateY(6px)}}
@keyframes parpadeo{50%{opacity:.2}}
.registrar{display:grid;grid-template-columns:2fr 1fr;margin-bottom:8px}
.registrar button{height:64px;border:0;background:var(--acc);color:#0B0B0B;font:700 15px/1 var(--fl);font-stretch:80%;letter-spacing:.2em;text-transform:uppercase}
.registrar button+button{background:var(--ink);color:var(--bg)}
.registrar button:hover{filter:brightness(1.08)}
@media (max-width:760px){
  .vivo{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:20px 16px 22px}
  .vivo canvas{height:440px;top:30px}
  .vivo .vc,.vivo .tit,.vivo .alr{position:relative;inset:auto;max-width:none}
  .vivo .vc b{font-size:28px}
  .vivo .vc .lbl{font-size:12px;letter-spacing:.04em}
  .vivo .tit{grid-column:1 / -1;margin-top:250px}
  .vivo .tit h2{font-size:clamp(56px,17vw,92px);white-space:normal}
  .vivo .alr{grid-column:1 / -1;width:auto;transform:none!important}
  .pulso{grid-template-columns:minmax(0,1fr);gap:14px;padding:20px 16px}
  .pcols{height:210px;gap:3px}.pcol .d{width:8px;height:5px}
  .registrar{grid-template-columns:1fr}
}

/* ===================== Rediseño por pantallas (nov 2026) =====================
   Una pantalla por concepto y cada una con su estilo. Índice fijo a la izquierda sin números (Shopify Editions),
   portada orbital (Onlook: cintas 3D de fondo, barra de menú, widgets, esfera de conceptos y dock),
   avisos apilados (Filmtopia) y botón Cargar según la pantalla (Ugly Cash).
   Cada pantalla pisa los tokens en body.v-<vista>; los gráficos los leen de body (readK). */
.panel{border-radius:var(--r)}
.nav,.hud,.subtabs{display:none!important}
.util .pdf{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--sep2);border-radius:var(--pill);background:var(--bg);color:var(--ink);font-size:12px;font-weight:500}
.util .pdf svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.util{background:transparent;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:6px}
.main{padding-top:4px}
#vhead:empty{display:none}
.util{background:transparent;color:var(--ink)}
.util .tcinfo{color:var(--ink)}.util .tcinfo #tclbl,.util .tcinfo #tcsrc{color:var(--sec)}
.util .chip,.util .eye,.util .seg button,.util .pdf{background:transparent;border:1px solid var(--sep2);border-radius:var(--pill);color:var(--ink);font-family:var(--f);font-stretch:normal;font-weight:500;letter-spacing:0;text-transform:none}
.util .seg button[aria-pressed="true"],.util .eye[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.util .chip.bad{color:var(--red)}.util .chip.busy .dot{background:var(--ink)}
#alerts .alpill{justify-self:end;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:rgba(36,36,44,.8);color:#fff;font:600 13.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#alerts .alpill i{width:8px;height:8px;border-radius:50%;background:#FF5E57}
@media (max-width:900px){#alerts .alpill{justify-self:start}}

/* índice */
#ix{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:30;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 20px 0 24px;color:var(--ink)}
#ix button{border:0;background:none;padding:0;text-align:left;color:inherit;font-family:"Instrument Sans",var(--f)}
#ix .home{font:700 15px/1.1 "Instrument Sans",var(--f);letter-spacing:-.01em;margin-bottom:26px}
#ix .home span{display:block;font:400 italic 15px/1.2 "Instrument Serif",Georgia,serif;opacity:.7;margin-top:4px}
#ix .it{display:flex;align-items:baseline;gap:6px;min-height:28px;color:color-mix(in srgb,var(--ink) 46%,transparent);font:600 21px/1.1 "Instrument Sans",var(--f);letter-spacing:-.02em;transition:color .2s}
#ix .it small{flex:1;display:flex;gap:6px;align-items:baseline;justify-content:flex-end;min-width:0;font:400 11px/1 "Geist Mono",var(--fm);letter-spacing:0;white-space:nowrap;overflow:hidden;color:inherit}
#ix .it small::before{content:"";flex:1;min-width:8px;border-bottom:1px dotted currentColor;opacity:0;transform:translateY(-3px)}
#ix .it:hover,#ix .it[aria-current="page"]{color:var(--ink)}
#ix .it[aria-current="page"] small::before{opacity:.8}
body:not(.v-cabina) .app{padding-left:236px}
body.v-cabina #ix,body.v-cabina .util{display:none}
@media (max-width:900px){
  #ix{bottom:auto;right:0;width:auto;height:52px;flex-direction:row;align-items:center;justify-content:flex-start;gap:18px;padding:0 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg);box-shadow:inset 0 -1px 0 var(--sep)}
  #ix::-webkit-scrollbar{display:none}
  #ix .home{margin:0;font-size:14px;white-space:nowrap}#ix .home span{display:none}
  #ix .it{font-size:16px;white-space:nowrap;min-height:44px;align-items:center}#ix .it small{display:none}
  body:not(.v-cabina) .app{padding-left:0;padding-top:52px}
}

/* avisos apilados */
#alerts{position:fixed;right:16px;bottom:84px;z-index:35;display:grid;gap:8px;width:290px}
#alerts .al{position:relative;display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 40px 12px 14px;background:rgba(36,36,44,.72);color:#fff;font:400 13.5px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.28);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);animation:alIn .5s cubic-bezier(.2,.8,.2,1) both;cursor:pointer}
#alerts .al b{display:block;font-size:14px;font-weight:600}
#alerts .al.crit b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF5E57;margin-right:7px;vertical-align:1px}
#alerts .al .x{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:12px;line-height:1}
@keyframes alIn{from{opacity:0;transform:translateX(30px)}}
@media (max-width:900px){#alerts{left:12px;right:12px;width:auto;bottom:78px}#alerts .al:nth-child(n+2){display:none}}

/* cargar */
#cargar{position:fixed;right:18px;bottom:20px;z-index:36;height:52px;padding:0 22px;border:0;border-radius:99px;background:#0E0E0E;color:#fff;font:700 15px/1 "Instrument Sans",var(--f);box-shadow:0 0 0 2px #FF3DA8,0 10px 30px rgba(0,0,0,.3);animation:cargarGlow 2.6s ease-in-out infinite}
@keyframes cargarGlow{50%{box-shadow:0 0 0 2px #B6FF3B,0 10px 30px rgba(0,0,0,.3)}}
#cmenu{position:fixed;right:18px;bottom:82px;z-index:37;display:grid;gap:4px;min-width:230px;padding:8px;border-radius:18px;background:rgba(36,36,44,.86);border:1px solid rgba(255,255,255,.16);box-shadow:0 16px 40px rgba(0,0,0,.35);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
#cmenu button{height:44px;border:0;border-radius:11px;background:none;color:#fff;text-align:left;padding:0 14px;font:500 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
#cmenu button:hover,#cmenu button:focus-visible{background:rgba(255,255,255,.14)}
body.v-cabina #cargar{display:none!important;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 24px rgba(0,0,0,.3);animation:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
@media (max-width:900px){#cargar{bottom:16px;right:12px}}

/* palabra que crece al entrar desde la esfera */
#zoom{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;font:700 clamp(56px,12vw,190px)/1 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 40px rgba(80,60,200,.6);opacity:0}

/* ===== RESUMEN: portada orbital (Onlook) ===== */
body.v-cabina{color-scheme:dark;background:#0B0B12;
  --bg:#0B0B12; --card:rgba(255,255,255,.06); --ink:#FFFFFF; --ink2:#E6E6EE; --sec:rgba(255,255,255,.68); --ter:rgba(255,255,255,.5);
  --sep:rgba(255,255,255,.12); --sep2:rgba(255,255,255,.24); --fill:rgba(255,255,255,.08); --fill2:rgba(255,255,255,.14);
  --green:#4ADE80; --green-f:#4ADE80; --red:#FF6B5E; --red-f:#FF6B5E; --acc:#8B7BFF; --on-ink:#0B0B12; --stone:#C9A27E; --mustard:#E8B64A; --orange:#FF9A5C;
  --prizm:#FFFFFF; --hover:rgba(255,255,255,.06); --toast:#FFFFFF; --g:255,255,255; --sheet:#16161F; --void:#16161F;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif; --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --fx:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif; --fl:var(--f);
  --r:20px; --rs:12px; --pill:99px}
body.v-cabina{--hero:rgba(255,255,255,.06);--hero-ink:#FFFFFF;--hero-sec:rgba(255,255,255,.7);--prizm-soft:rgba(255,255,255,.06)}
body.v-cabina .camp{border:1px solid rgba(255,255,255,.1);border-radius:20px}
body.v-cabina .app{background:radial-gradient(1200px 700px at 15% 120vh,rgba(91,63,224,.22),transparent 70%),radial-gradient(900px 600px at 90% 160vh,rgba(224,66,154,.14),transparent 70%)}
body.v-cabina .panel{border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4)}
body.v-cabina .ph h2{font:600 20px/1.2 var(--fd);text-transform:none;letter-spacing:-.01em}
body.v-cabina .kpi .v,body.v-cabina .big,body.v-cabina .gstats b,body.v-cabina .rate b{font-weight:700;letter-spacing:-.03em}
body.v-cabina .scale{padding-top:24px}
.orb{position:relative;height:100vh;height:100svh;min-height:620px;background:#0B0B12;color:#fff;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
.orb canvas{position:absolute;display:block}

.orb .mb{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;gap:16px;height:28px;padding:0 12px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;font-size:13px;background:rgba(10,10,18,.38);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6)}
.orb .mb b{font-weight:700}
.orb .mb .sp{flex:1}
.orb .mb button{border:0;background:none;color:#fff;padding:0 4px;height:28px;font:inherit;opacity:.92;white-space:nowrap}
.orb .mb button:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.orb .mb button[aria-pressed="true"]{font-weight:700;opacity:1}
.orb .mb .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ADE80;margin-right:6px;vertical-align:1px}
.orb .mb .dot.bad{background:#FF6B5E}.orb .mb .dot.busy{background:#E8B64A}
.orb .mb span{white-space:nowrap;opacity:.92}
.orb .tit{position:absolute;left:0;right:0;top:calc(7% + 28px);z-index:3;text-align:center;pointer-events:none;padding:0 16px}
.orb .tit .k{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.75)}
.orb .tit .k.ok{color:#4ADE80}
.orb .tit h1{margin:6px 0 4px;font-weight:700;font-size:clamp(44px,6.4vw,92px);line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.orb .tit p{margin:0 auto;max-width:640px;font-size:15px;color:rgba(255,255,255,.78)}
.orb .tit p b{color:#fff}
.orb .bar2{position:relative;width:min(360px,70vw);height:4px;margin:14px auto 0;border-radius:4px;background:rgba(255,255,255,.18);overflow:visible}
.orb .bar2 i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#8B7BFF,#E0429A)}
.orb .bar2 em{position:absolute;top:-4px;width:2px;height:12px;background:#fff;border-radius:2px}

.orb .wg.l{left:22px;top:40%}.orb .wg.r{right:22px;top:40%}
.orb .w{display:grid;gap:2px;padding:12px 14px;border-radius:18px;background:rgba(40,40,48,.42);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);text-align:left;color:#fff;font:inherit}
.orb .w span{font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}

.orb .w b.pos{color:#4ADE80}.orb .w b.neg{color:#FF8A80}
button.w{cursor:pointer}button.w:hover{background:rgba(60,60,70,.55)}
.orb .notif{position:absolute;right:14px;top:40px;z-index:4;width:300px;display:grid;grid-template-columns:38px 1fr;gap:4px 10px;align-items:start;padding:12px 14px;border-radius:18px;background:rgba(40,40,48,.6);border:1px solid rgba(255,255,255,.14);color:#fff;text-align:left;font:inherit;backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer;animation:alIn .6s .3s cubic-bezier(.2,.8,.2,1) both}
.orb .notif svg{grid-row:span 2;width:38px;height:38px;border-radius:9px}
.orb .notif b{font-size:13.5px;font-weight:600}
.orb .notif b em{float:right;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}

<script>
(() => {

const CATS = ["súper","salidas","suscripciones","transporte","cuidado personal","salud","deporte y outdoor","ropa y equipo","compras al exterior","impuestos","bancos","ingresos","varios"];
/* Paleta del escudo (mostaza, naranja, rojo, marrón). Cada tono pasa 3:1 sobre papel y sobre negro.

const CATRULES = [

function catSuggest(g){

  return {comida:"salidas", ropa:"ropa y equipo", generales:"varios", "gastos bancarios":"bancos", ganancias:"ingresos"}[old] || old;
}
const catPlan = () => cfg().catsV2 ? [] : S.gastos.map(g => [g, catSuggest(g)]).filter(([g, k]) => k && k !== g.categoria && (OLDCAT.includes(g.categoria) || g.categoria === "salud" || !CATS.includes(g.categoria)));
const EXTRA = ["#B85216","#8C6244","#9A7A1C","#7A6C5A"];
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DEF_CFG = {objetivo:1500000, tc:{}, saldos:[], monotributo:"A"};
const DEF_TC = 1500;
const NOW = new Date();
const CUR_YM = NOW.getFullYear()+"-"+String(NOW.getMonth()+1).padStart(2,"0");

const K = {ink:"#1D1D1F", sec:"#6E6E73", ter:"#8E8E93", card:"#FFFFFF", g:"60,60,67", green:"#0A7038", red:"#B4311E", acc:"#F12719", stone:"#8A5A3A", greenRgb:"10,112,56", redRgb:"180,49,30", accRgb:"241,39,25"};
const hexRgb = h => { const m = /^#?([0-9a-f]{6})$/i.exec(String(h||"").trim()); if (!m) return ""; const n = parseInt(m[1], 16); return ((n>>16)&255)+","+((n>>8)&255)+","+(n&255); };
function readK(){ try { const cs = getComputedStyle(document.body), v = n => cs.getPropertyValue(n).trim();
  K.ink = v("--ink") || K.ink; K.sec = v("--sec") || K.sec; K.ter = v("--sec") || K.ter; K.card = v("--card") || K.card; K.g = v("--g") || K.g;
  K.green = v("--green") || K.green; K.red = v("--red") || K.red; K.acc = v("--acc") || K.acc; K.stone = v("--stone") || K.stone;
  K.greenRgb = hexRgb(K.green) || K.greenRgb; K.redRgb = hexRgb(K.red) || K.redRgb; K.accRgb = hexRgb(K.acc) || K.accRgb; } catch(e){} }
const ls = {get(k){try{return localStorage.getItem("mr:"+k)}catch(e){return null}}, set(k,v){try{localStorage.setItem("mr:"+k,v)}catch(e){}}};
const S = {
  retiros:[], gastos:[], comisiones:[], inversiones:[], cheques:[], cuenta:[], cocos:[], movs:[], config:null,
  mode:"loading", rev:0, clave:"", sync:"", dl:true, pendingImport:null,
  cur: ls.get("cur")==="ARS"?"ARS":"USD", hide: ls.get("hide")==="1", gasAcum: ls.get("gasv")==="acum", gasOrd: "v",
  view: "cabina", sel:null,
  fRet:"todos", fGas:"todas", qRet:"", qGas:"", donut:"mes", incl5:true,
  chat:[], chatBusy:false, ctl:null
};
const SELF = new Set();
const VIEWS = ["cabina","retiros","gastos","arca","comisiones","cuentas","inversiones","cheques","papa","ajustes"];
const TITLES = {cabina:"Resumen",retiros:"Retiros",gastos:"Gastos",arca:"ARCA",comisiones:"Cobros 5%",cuentas:"Cartera",inversiones:"Cartera",cheques:"Cartera",papa:"Cartera",ajustes:"Ajustes"};
const NOPER = ["cuentas","inversiones","cheques","papa"];
if (location.hash === "#cartera") S.view = "cuentas";
else if (VIEWS.includes(location.hash.slice(1))) S.view = location.hash.slice(1);
else { const v = ls.get("view"); if (VIEWS.includes(v)) S.view = v; }
if (S.view === "comisiones") S.view = "cabina"; /* Cobros 5% salió de la navegación */

/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const catL = c => { c = String(c ?? ""); return esc(c.charAt(0).toUpperCase() + c.slice(1)); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cfg = () => Object.assign({}, DEF_CFG, S.config || {});
const ymOf = f => String(f||"").slice(0,7);
/* Mes razonable (2000-2099). Una fecha mal tipeada (ej. año 0011) no debe correr el rango de meses de toda la app. */
const okYM = x => /^20\d{2}-(0[1-9]|1[0-2])$/.test(x);
/* Fecha AAAA-MM-DD que existe de verdad, con año 2000-2099. */
const okF = f => { f = String(f ?? ""); if (!/^\d{4}-\d{2}-\d{2}$/.test(f) || !okYM(f.slice(0,7))) return false; const d = new Date(f + "T12:00:00Z"); return !isNaN(d) && d.toISOString().slice(0,10) === f; };
/* Un movimiento a más de un año hacia adelante es casi seguro un error de tipeo: months() lo deja afuera para que no corra el rango. */
const lejos = ym => ym > addM(CUR_YM, 12);
const ymLabel = ym => { if (!okYM(ym)) return "Fecha inválida"; const [y,m] = ym.split("-"); return MES[+m-1]+" "+y.slice(2); };
const ymLong = ym => { if (!okYM(ym)) return "Fecha inválida"; const [y,m] = ym.split("-"); return MESL[+m-1]+" "+y; };
const ddmm = f => f ? f.slice(8,10)+"/"+f.slice(5,7) : "—";
const yy = f => String(f ?? "").slice(2,4);
const addM = (ym,n) => { let [y,m] = ym.split("-").map(Number); m += n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return String(y).padStart(4,"0")+"-"+String(m).padStart(2,"0"); };
const mDiff = (a,b) => { const [ya,ma]=a.split("-").map(Number), [yb,mb]=b.split("-").map(Number); return (yb-ya)*12+(mb-ma); };
const catColor = (() => { const extra = {}; let i = 0; return c => CATC[c] === "INK" ? K.ink : CATC[c] || extra[c] || (extra[c] = EXTRA[(i++)%EXTRA.length]); })();

/* Cotización: dólar oficial BNA, venta, de cada día. Ajustes permite fijar un mes a mano. */
const TCD = {days:{}, keys:[], avg:{}, today:0, at:""};
function tcIndex(){
  TCD.keys = Object.keys(TCD.days).sort(); TCD.avg = {};
  const acc = {}; for (const k of TCD.keys){ const m = k.slice(0,7); (acc[m] = acc[m] || []).push(TCD.days[k]); }
  for (const m in acc) TCD.avg[m] = acc[m].reduce((a,b) => a+b, 0) / acc[m].length;
}
function tcAuto(f){
  const L = TCD.keys; if (!L.length) return 0;
  if (TCD.days[f]) return TCD.days[f];
  let lo = 0, hi = L.length - 1, best = -1;
  while (lo <= hi){ const mid = (lo + hi) >> 1; if (L[mid] <= f){ best = mid; lo = mid + 1; } else hi = mid - 1; }
  return best >= 0 ? TCD.days[L[best]] : 0;
}
function tcManual(ym){ const t = cfg().tcManual || {}; return +t[ym] || 0; }
function tcFallback(ym){
  const t = cfg().tc || {}; if (t[ym]) return +t[ym];
  const ks = Object.keys(t).filter(k => +t[k] > 0).sort();
  if (!ks.length) return DEF_TC;
  let best = null; for (const k of ks) if (k <= ym) best = k;
  return +t[best || ks[0]];
}
function tcFor(ym){
  const m = tcManual(ym); if (m) return m;
  if (TCD.avg[ym]) return TCD.avg[ym];
  return tcAuto(ym + "-31") || tcFallback(ym);
}
function tcDay(f){
  const ym = ymOf(f), m = tcManual(ym); if (m) return m;
  if (TCD.today && TCD.keys.length && f > TCD.keys[TCD.keys.length-1]) return TCD.today;
  return tcAuto(f) || tcFallback(ym);
}
async function loadTC(){
  try { const c = JSON.parse(localStorage.getItem("mayor_rossi_tc") || "null");
    if (c && c.days){ TCD.days = c.days; TCD.today = c.today || 0; TCD.at = c.at || ""; tcIndex(); }
    if (c && c.at && Date.now() - c.at < 6*36e5) return; } catch(e){}
  try {
    const r = await fetch("https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial", {cache:"no-store"});
    if (r.ok){ const arr = await r.json(); const d = {};
      for (const x of arr) if (x && x.fecha && x.fecha >= "2025-01-01" && +x.venta > 0) d[x.fecha] = +x.venta;
      if (Object.keys(d).length) TCD.days = d; }
  } catch(e){}
  try { const r = await fetch("https://dolarapi.com/v1/dolares/oficial", {cache:"no-store"});
    if (r.ok){ const j = await r.json(); if (+j.venta > 0){ TCD.today = +j.venta; const f = (j.fechaActualizacion || "").slice(0,10) || NOW.toISOString().slice(0,10); TCD.days[f] = +j.venta; } } } catch(e){}
  tcIndex(); TCD.at = Date.now();
  try { localStorage.setItem("mayor_rossi_tc", JSON.stringify({days:TCD.days, today:TCD.today, at:TCD.at})); } catch(e){}
  if (S.mode !== "loading") render();
}
/* precios de inversiones: cripto en Binance, CEDEARs y acciones en data912 (ARS ÷ MEP) */
const PXK = "mayor_rossi_px", AUTO = ["cedear","accion","cripto"], STABLE = ["USDT","USDC","DAI","FDUSD","USD"];
const PX = {p:{}, mep:0, at:0, busy:false, fail:""};
try { const c = JSON.parse(localStorage.getItem(PXK) || "null"); if (c) Object.assign(PX, c, {busy:false}); } catch(e){}
const pxKey = h => (h.tipo === "cripto" ? "C:" : h.tipo === "accion" ? "A:" : "D:") + String(h.ticker||"").toUpperCase().trim();
function pxOf(h){
  const t = String(h.ticker||"").toUpperCase().trim();
  if (+h.precio > 0) return {v: AUTO.includes(h.tipo) ? +h.precio * (+h.cantidad||0) : +h.precio, src:"manual"};
  if (h.tipo === "cripto" && STABLE.includes(t)) return {v:+h.cantidad||0, src:"estable"};
  const p = PX.p[pxKey(h)];
  if (AUTO.includes(h.tipo) && p > 0) return {v: p * (+h.cantidad||0), src:"online"};
  return {v: +h.costo||0, src:"sin precio"};
}
/* ---------- Cocos: movimientos importados del CSV ---------- */
const nAR = x => { x = String(x ?? "").trim(); if (!x) return 0; const v = parseFloat(x.replace(/\./g, "").replace(",", ".")); return isFinite(v) ? v : 0; };
const fISO = d => { const m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(String(d||"").trim()); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; };
function parseCocos(txt){
  const L = txt.replace(/^﻿/, "").split(/\r?\n/).filter(x => x.trim()); if (!L.length) return null;
  const H = L[0].split(";").map(x => x.trim()); const ix = k => H.indexOf(k);
  if (ix("nroTicket") < 0 || ix("tipoOperacion") < 0 || ix("total") < 0) return null;
  return L.slice(1).map(l => { const c = l.split(";"); const g = k => (c[ix(k)] || "").trim();
    return {t: g("nroTicket") + "-" + g("nroComprobante"), f: fISO(g("fechaEjecucion")), op: g("tipoOperacion"), ins: g("instrumento"), mon: g("moneda") === "USD" ? "USD" : "ARS", q: nAR(g("cantidad")), px: nAR(g("precio")), tot: nAR(g("total"))}; })
    .filter(r => r.f && r.op);
}
const cocosCode = ins => { const m = /\(([A-Z0-9.]+)\)\s*$/.exec(ins || ""); return m ? m[1] : (ins || "").trim(); };
function cocosTipo(ins){ const u = (ins||"").toUpperCase();
  if (/^FCI\b/.test(u)) return "fci"; if (/^CEDEAR\b/.test(u)) return "cedear"; if (/LETRA|LECAP|BONO|^ON\b|OBLIGAC|TESORO/.test(u)) return "lecap"; if (/^ACCION|ACCIONES/.test(u)) return "accion"; return "otro"; }
const cocosVto = ins => { const m = /(\d{2})\/(\d{2})\/(\d{2})\b/.exec(ins||""); return m ? `20${m[3]}-${m[2]}-${m[1]}` : ""; };
const unitOf = (tipo, px) => tipo === "fci" ? px / 1000 : tipo === "lecap" ? px / 100 : px;
const mepHoy = () => PX.mep || usdHoy();
const toUSDf = (v, mon, f) => mon === "USD" ? v : v / tcDay(f);
const ratioOf = code => ((cfg().cocosRatio || {})[code] || []).filter(e => okF(e.f) && +e.x > 0).map(e => ({f:e.f, x:+e.x})).sort((a,b) => a.f < b.f ? -1 : 1);
/* posiciones a partir de los movimientos: costo promedio en USD (pesos al oficial del día); la tenencia inicial que no está en el CSV
   se estima con lo mínimo necesario para que nunca quede negativa, o la fija Santi con «Ajustar tenencia» */
function cocosPos(){
  const R = (S.cocos||[]).filter(r => r.ins && r.q && !/registracion/i.test(r.op) && !/^(peso argentino|dolar especie)/i.test(r.ins))
    .slice().sort((a,b) => a.f < b.f ? -1 : a.f > b.f ? 1 : a.t < b.t ? -1 : 1);
  const by = {}; R.forEach(r => (by[cocosCode(r.ins)] = by[cocosCode(r.ins)] || []).push(r));
  const aj = cfg().cocosAj || {}, out = [];
  for (const [code, rs] of Object.entries(by)){
    const tipo = cocosTipo(rs[0].ins), mon = rs[rs.length-1].mon, vto = cocosVto(rs[0].ins);
    /* cambios de ratio (config.cocosRatio[ticker] = [{f, x}]): desde esa fecha cada unidad vieja son x nuevas; el costo total no cambia */
    const rx = ratioOf(code), rxAt = f => rx.filter(e => e.f <= f).reduce((a,e) => a * e.x, 1);
    let run = 0, min = 0, fx = 1; rs.forEach(r => { const k = rxAt(r.f); if (k !== fx){ run *= k / fx; min *= k / fx; fx = k; } run += r.q; if (run < min) min = run; });
    const auto = Math.max(0, -min), q0 = aj[code] !== undefined ? Math.max(0, +aj[code]) : auto;
    const first = rs[0], u0 = unitOf(tipo, first.px);
    let qty = q0, cost = q0 * toUSDf(u0, first.mon, first.f), real = 0, fq = rxAt(first.f);
    for (const r of rs){
      const k = rxAt(r.f); if (k !== fq){ qty *= k / fq; fq = k; }
      const usd = toUSDf(r.tot, r.mon, r.f);
      if (r.q > 0){ qty += r.q; cost += -usd; }
      else { const out_ = Math.min(-r.q, qty); const avg = qty > 0 ? cost / qty : 0; real += usd - avg * out_; cost -= avg * out_; qty += r.q; if (qty < 1e-6) { qty = Math.max(qty, 0); if (qty === 0) cost = 0; } }
    }
    const hoyF = NOW.toISOString().slice(0,10), kHoy = rxAt(hoyF); if (kHoy !== fq){ qty *= kHoy / fq; }
    const last = rs[rs.length-1], uLast = unitOf(tipo, last.px || rs.filter(r => r.px).slice(-1)[0]?.px || 0) / (kHoy / rxAt(last.f));
    const vencida = vto && vto < NOW.toISOString().slice(0,10);
    if (vencida) { qty = 0; cost = 0; }
    let v = 0, src = "último precio";
    const on = tipo === "cedear" ? PX.p["D:" + code] : tipo === "accion" ? PX.p["A:" + code] : 0;
    if (on > 0){ v = on * (PX.mep || usdHoy()) / usdHoy() * qty; src = "online"; }
    else v = mon === "USD" ? uLast * qty : uLast * qty / usdHoy();
    out.push({id:"cocos:" + code, cocos:true, broker:"Cocos", tipo, ticker:code, nombre:rs[0].ins.replace(/\s*\([A-Z0-9.]+\)\s*$/, ""), mon, cantidad:qty, costo:cost, real,
      px:{v, src: vencida ? "vencida" : src}, estimada: aj[code] === undefined && auto > 0, q0, n: rs.length, ult: last.f, ratio: rx});
  }
  return out;
}
function cocosStats(){
  const R = S.cocos || []; if (!R.length) return null;
  const sum = (fn, k = "tot") => R.filter(fn).reduce((a,r) => a + r[k], 0);
  const meses = {}; const M = r => (meses[r.f.slice(0,7)] = meses[r.f.slice(0,7)] || {ing:0, usd:0, ars:0, pagU:0, pagA:0});
  R.forEach(r => { const m = M(r);
    if (/^recibo de cobro/i.test(r.op)) m.ing += r.tot;
    if (/^venta registracion usd/i.test(r.op)) m.usd += r.tot;
    if (/^compra registracion ars/i.test(r.op)) m.ars += -r.tot;
    if (/^orden de pago usd/i.test(r.op)) m.pagU += -r.tot;
    else if (/^orden de pago/i.test(r.op)) m.pagA += -r.tot; });
  const usd = sum(r => /^venta registracion usd/i.test(r.op)), arsMep = -sum(r => /^compra registracion ars/i.test(r.op));
  const cauc = sum(r => /caucion/i.test(r.op));
  const renta = sum(r => /renta y amortizacion|dividendo/i.test(r.op) && r.mon === "ARS"), rentaU = sum(r => /renta y amortizacion|dividendo/i.test(r.op) && r.mon === "USD");
  const fs = R.map(r => r.f).sort();
  return {n:R.length, desde:fs[0], hasta:fs[fs.length-1], ing:sum(r => /^recibo de cobro/i.test(r.op)), usd, arsMep, mep: usd ? arsMep/usd : 0,
    pagU:-sum(r => /^orden de pago usd/i.test(r.op)), nPagU:R.filter(r => /^orden de pago usd/i.test(r.op)).length, pagA:-sum(r => /^orden de pago$/i.test(r.op)),

function factBars(rows, mx){

function vCheques(){
  const L = (S.cheques||[]).slice().sort((a,b) => a.vencimiento < b.vencimiento ? -1 : 1);
  const open = L.filter(q => !q.cobrado), done = L.filter(q => q.cobrado);
  const nom = open.reduce((a,q) => a + (+q.nominal||0), 0), pag = open.reduce((a,q) => a + (+q.pagado||0), 0);
  const tnaW = pag ? open.reduce((a,q) => a + chqTNA(q) * (+q.pagado||0), 0) / pag : 0;
  const gan = done.reduce((a,q) => a + valD((+q.nominal||0) - (+q.pagado||0), q.vencimiento), 0);
  const cal = {}; open.filter(q => okF(q.vencimiento)).forEach(q => { const m = ymOf(q.vencimiento); cal[m] = cal[m] || {n:0, v:0}; cal[m].n++; cal[m].v += +q.nominal||0; });
  const calK = Object.keys(cal).sort().slice(0, 6);

    return `<div class="row ${late || d <= 3 ? "late" : ""}"><div class="when">${ddmm(q.vencimiento)}<small>${!isFinite(d) ? "fecha inválida" : late ? `vencido hace ${-d} d` : d === 0 ? "vence hoy" : `en ${d} días`}</small></div>
      <div class="who"><b>${esc(q.librador || "Cheque")}</b><span>comprado ${ddmm(q.fecha)} · ${chqDias(q)} días · TNA ${pct(chqTNA(q),1)}</span></div>
      <div class="amt"><b>${ars(+q.nominal||0)}</b><span>+${ars((+q.nominal||0)-(+q.pagado||0))}</span></div></div>`; };
  return `<div class="strip">

    <div class="panel"><span class="lbl">Ganancia a cobrar</span><b class="num pos">${fmt(valD(nom - pag, CUR_YM+"-01"))}</b></div>
    <div class="panel"><span class="lbl">TNA promedio</span><b class="num">${pct(tnaW,1)}</b></div>
    <div class="panel"><span class="lbl">Ganado (cobrados)</span><b class="num pz">${fmt(gan)}</b></div>
  </div>
  <div class="grid">
    <section class="panel s7" aria-labelledby="h-due"><div class="ph"><h2 id="h-due">Próximos vencimientos</h2><span class="meta">${open.length} sin cobrar</span></div>
      <div class="due">${open.length ? open.map(row).join("") : `<div class="empty"><b>Nada por cobrar</b>Cargá los cheques que compres en la mesa.</div>`}</div></section>
    <section class="panel s5" aria-labelledby="h-cal" style="align-self:start"><div class="ph"><h2 id="h-cal">Calendario</h2><span class="meta">nominal por mes</span></div>
      ${calK.length ? `<div class="cal" style="grid-template-columns:repeat(2,minmax(0,1fr))">${calK.map(m => `<div><span>${esc(ymLong(m))}</span><b>${compact(cal[m].v, "ARS")}</b><small>${cal[m].n} cheque${cal[m].n>1?"s":""}</small></div>`).join("")}</div>` : `<div class="empty"><b>Sin vencimientos</b></div>`}</section>
  </div>
  <section class="panel" aria-labelledby="h-chq" style="margin-top:8px">
    <div class="ph"><h2 id="h-chq">Mesa de cheques</h2><button class="btn primary" data-act="new" data-col="cheques"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuevo cheque</button></div>
    <div class="tw"><table><thead><tr><th>Compra</th><th>Librador</th><th class="r">Pagado</th><th class="r">Nominal</th><th>Vence</th><th class="r">Ganancia</th><th class="r">TNA</th><th>Cobrado</th><th><span class="sr">Acciones</span></th></tr></thead><tbody>
    ${L.length ? L.slice().reverse().map(q => `<tr><td class="d">${ddmm(q.fecha)}</td><td>${esc(q.librador||"—")}${q.nota?`<span class="note">${esc(q.nota)}</span>`:""}</td>
      <td class="m r">${ars(+q.pagado||0)}</td><td class="m r">${ars(+q.nominal||0)}</td><td class="d ${!q.cobrado && daysTo(q.vencimiento) < 0 ? "neg" : ""}">${ddmm(q.vencimiento)}/${yy(q.vencimiento)}</td>
      <td class="m r pos">${ars((+q.nominal||0)-(+q.pagado||0))}</td><td class="m r">${pct(chqTNA(q),1)}</td>
      <td><button class="sw" role="switch" aria-checked="${!!q.cobrado}" data-act="qcob" data-id="${esc(q.id)}" aria-label="Cobrado: ${esc(q.librador||"cheque")}"></button></td>

/* mapa de calor de gastos: una fila por mes (los últimos 6 hasta el elegido), un cuadrado por día */
function heatDraw(ms){
  const c = document.getElementById("heat"); if (!c) return;
  const hasta = S.sel === "all" ? ms[ms.length-1] : S.sel, i = ms.indexOf(hasta), rows = ms.slice(Math.max(0, i - 5), i + 1); if (!rows.length) return;
  const W = c.clientWidth, lab = 56, cell = Math.max(6, Math.floor((W - lab) / 31)), ch = Math.max(cell, 16), gap = cell > 10 ? 2 : 1, H = rows.length * ch, d = Math.min(2, devicePixelRatio || 1);
  c.width = W * d; c.height = H * d; c.style.height = H + "px"; const x = c.getContext("2d"); x.setTransform(d, 0, 0, d, 0, 0);
  const by = {}; for (const g of S.gastos){ if (!(+g.importe > 0) || !okF(g.fecha)) continue; const k = g.fecha; by[k] = (by[k]||0) + (+g.importe); }
  const vals = Object.entries(by).filter(([k]) => rows.includes(k.slice(0,7))).map(e => e[1]).sort((a,b) => a-b);
  const q = p => vals.length ? vals[Math.min(vals.length-1, Math.floor(p * vals.length))] : 0, th = [q(.2), q(.4), q(.6), q(.8)];
  const pal = ["#1D2A6B","#3B5BDB","#F4C20D","#F08C00","#E03131"];
  const t0 = performance.now();
  (function paso(t){
    if (!c.isConnected) return;
    const k = RM ? 1 : Math.min(1, (t - t0) / 900);
    x.clearRect(0, 0, W, H); x.font = "400 11px 'Geist Mono', monospace"; x.textBaseline = "middle"; x.fillStyle = "#5E5E5E";
    rows.forEach((m, r) => { x.fillStyle = "#5E5E5E"; x.fillText(ymLabel(m).toUpperCase(), 0, r * ch + ch / 2);
      const dim = new Date(+m.slice(0,4), +m.slice(5), 0).getDate();
      for (let dd = 1; dd <= dim; dd++){ if ((dd - 1) / 31 > k * 1.2 - r * .04) continue; const v = by[m + "-" + String(dd).padStart(2, "0")] || 0;
        x.fillStyle = !v ? "#ECECEC" : pal[v <= th[0] ? 0 : v <= th[1] ? 1 : v <= th[2] ? 2 : v <= th[3] ? 3 : 4];
        x.fillRect(lab + (dd - 1) * cell, r * ch, cell - gap, ch - gap); } });
    if (k < 1) requestAnimationFrame(paso);
  })(t0);
}

const listOf = col => S[col];

/* ===================== sincronización con la nube ===================== */
const API = "/api/datos", CACHE = "mayor_rossi_v1", KEY = "mayor_rossi_clave";
let saveT = null, saving = false, dirty = false, forceNext = false, lastRef = 0;
/* Reintentos y frenos: un fallo nunca puede disparar pedidos al Blob en bucle (cada put cuenta como operación avanzada, el cupo es chico).
   - Tras un error se reintenta solo hasta 3 veces, esperando 2 s, 5 s y 15 s. Después queda "Sin guardar" hasta que se toque el estado o se cambie algo.
   - Al volver a la pestaña se refresca como máximo una vez cada 5 minutos (no hay refresco periódico).
   - Freno de emergencia: más de 30 PUT o 60 GET en 10 minutos corta la sincronización de esta sesión. */
const BACKOFF = [2000, 5000, 15000], REFRESCO_MIN = 5 * 60 * 1000, PAUSA_TXT = "Sincronización pausada";
const FRENO = {ventana: 10 * 60 * 1000, PUT: 30, GET: 60}, usos = {PUT: [], GET: []};
let fallos = 0, pausada = false;
const LISTAS = ["retiros","gastos","comisiones","inversiones","cheques","cuenta","cocos","movs"];
const snapshot = () => ({retiros:S.retiros, gastos:S.gastos, comisiones:S.comisiones, inversiones:S.inversiones, cheques:S.cheques, cuenta:S.cuenta, cocos:S.cocos, movs:S.movs, config:S.config || DEF_CFG});
const clone = o => JSON.parse(JSON.stringify(o));
const norm = d => { d = d || {}; const o = {}; for (const k of LISTAS) o[k] = Array.isArray(d[k]) ? d[k] : []; o.config = d.config || DEF_CFG; return o; };
/*MERGE-START*/
/* Fusión de tres vías: base = último estado que se sincronizó con el servidor, local = lo que hay acá,
   servidor = lo último que guardó otro dispositivo. Lo agregado o editado acá se suma, lo borrado acá se borra,
   y todo lo demás queda como está en el servidor. Así un cambio nunca pisa al del otro dispositivo. */
const keyOf = r => r && r.id !== undefined ? "i:" + r.id : r && r.t !== undefined ? "t:" + r.t : "j:" + JSON.stringify(r);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function mergeLista(base, local, server){
  const B = new Map((base || []).map(r => [keyOf(r), r])), L = new Map((local || []).map(r => [keyOf(r), r])), seen = new Set(), out = [];
  const mine = k => L.has(k) && (!B.has(k) || !same(L.get(k), B.get(k)));
  for (const r of server || []){ const k = keyOf(r); seen.add(k);
    if (B.has(k) && !L.has(k)) continue;
    out.push(mine(k) ? L.get(k) : r); }
  for (const r of local || []){ const k = keyOf(r); if (!seen.has(k) && mine(k)) out.push(r); }
  return out;
}
function mergeData(base, local, server){
  base = base || {}; const out = {};
  for (const k of LISTAS) out[k] = mergeLista(base[k], local[k], server[k]);
  const bc = base.config || {}, lc = local.config || {}, cfg = Object.assign({}, server.config || {});
  for (const k of new Set([...Object.keys(lc), ...Object.keys(bc)])) if (!same(lc[k], bc[k])){ if (k in lc) cfg[k] = lc[k]; else delete cfg[k]; }
  out.config = cfg; return out;
}
/*MERGE-END*/
const total = d => LISTAS.reduce((a, k) => a + (d[k] ? d[k].length : 0), 0);
function cacheLocal(){ try { localStorage.setItem(CACHE, JSON.stringify({rev:S.rev, data:snapshot(), dirty, base: dirty ? S.base : null})); } catch(e){} }
function setSync(t){ if (pausada) t = PAUSA_TXT; S.sync = t; const st = $("#status"); if (!st || S.mode !== "live") return;
  st.className = "chip " + (t === "Guardado" ? "live" : t === "Guardando…" ? "busy" : "bad"); st.lastElementChild.textContent = t; }
function pausar(){
  if (pausada) return; pausada = true; clearTimeout(saveT);
  console.error("[mayor-rossi] Sincronización pausada por el freno de emergencia: más de " + FRENO.PUT + " PUT o " + FRENO.GET + " GET en 10 minutos.", {put: usos.PUT.length, get: usos.GET.length});
  setSync(PAUSA_TXT); toast("Sincronización pausada: hubo demasiados pedidos seguidos al servidor. Tus cambios quedan en este dispositivo; recargá la página para reanudar.", true);
}
/* Único punto de salida hacia /api/datos: cuenta cada pedido y corta si se pasa del tope. */
function api(method, body){
  const L = usos[method], ahora = Date.now();
  while (L.length && ahora - L[0] > FRENO.ventana) L.shift();
  if (pausada || L.length >= FRENO[method]){ pausar(); return Promise.reject(Object.assign(new Error(PAUSA_TXT), {pausada:true})); }
  L.push(ahora);
  return fetch(API, {method, cache:"no-store", headers:{"content-type":"application/json","x-clave":S.clave}, body});
}
function changed(){ render(true); if (S.mode !== "live") return; dirty = true; fallos = 0; cacheLocal(); setSync("Guardando…"); clearTimeout(saveT); saveT = setTimeout(flush, 700); }
function later(ms){ if (pausada) return; clearTimeout(saveT); saveT = setTimeout(flush, ms); }
/* Queda sin guardar y NO se reintenta solo: hace falta tocar el estado o hacer un cambio. */
function parar(msg){ dirty = true; fallos = BACKOFF.length; cacheLocal(); setSync("Sin guardar"); toast(msg + " Tocá el estado para reintentar.", true); }
/* Reintento automático con espera creciente (2 s, 5 s, 15 s); pasado el tope queda "Sin guardar". Nunca reintenta en menos de 2 s. */
function reintentoAuto(msg){
  dirty = true; cacheLocal();
  if (pausada) return;
  if (fallos >= BACKOFF.length){ setSync("Sin guardar"); toast(msg + " Dejé de reintentar solo: tocá el estado para probar de nuevo.", true); return; }
  setSync("Guardando…"); later(BACKOFF[fallos++]);
}
function apply(data, rev){
  const d = data || {}; S.rev = +rev || 0;
  for (const k of LISTAS) S[k] = Array.isArray(d[k]) ? d[k] : [];

${lines.join("\n")}
TRANSFERENCIAS SIN FACTURAR:
${pend.join("\n") || "ninguna"}
INVERSIONES (USD): ${holdings().map(h => `${h.ticker} [${h.broker}] valor ${Math.round(h.px.v)} costo ${Math.round(+h.costo||0)}`).join("; ") || "sin datos"}
CHEQUES SIN COBRAR (ARS): ${(S.cheques||[]).filter(q => !q.cobrado).map(q => `${q.librador} pagado ${q.pagado} nominal ${q.nominal} vence ${q.vencimiento}`).join("; ") || "ninguno"}

async function ask(q){
  q = (q||"").trim(); if (!q || S.chatBusy) return;
  const log = $("#log"); if (!log) return;
  if (!S.sample){ log.insertAdjacentHTML("beforeend", `<div class="msg sys">El copiloto no está disponible en esta vista.</div>`); return; }
  if (!S.chat.length) log.innerHTML = "";
  S.chat.push({role:"user", content:q});
  log.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div>`);
  const bub = document.createElement("div"); bub.className = "msg ai"; bub.textContent = "Pensando…"; log.appendChild(bub); log.scrollTop = log.scrollHeight;
  $("#ask").value = ""; S.chatBusy = true; $("#sendBtn").disabled = true; $("#stopBtn").hidden = false;
  const RULES = `Sos el copiloto financiero de Santi, que administra su sueldo retirando transferencias de clientes de la pinturería familiar. Respondé en español rioplatense, cercano y profesional, breve y concreto (máximo 180 palabras salvo que pida detalle). Expresá los análisis en USD usando el TC de cada mes, salvo temas impositivos (ARCA, Monotributo) que van en pesos. Usá solo los datos de abajo; si algo no está, decilo. No uses markdown con tablas; listas cortas con guiones están bien.\n\n${context()}`;
  S.ctl = new AbortController();
  try {
    const turns = [{role:"user", content:RULES}, ...S.chat.slice(-10)];
    const { text } = await S.sample(turns, {cache:false, signal:S.ctl.signal, onText:({text}) => { bub.textContent = text; log.scrollTop = log.scrollHeight; }});
    S.chat.push({role:"assistant", content:text});
  } catch(e){
    bub.textContent = e.text || "";
    const m = {not_granted:"No diste permiso para usar Claude desde este tablero.", rate_limited:"Muchas consultas seguidas. Probá en un rato.", sampling_disabled:"Claude no está disponible para esta cuenta.", session_expired:"Tu sesión venció: volvé a iniciar sesión.", cancelled:""}[e.code] ?? "Se cortó la respuesta. Probá de nuevo.";
    if (m) log.insertAdjacentHTML("beforeend", `<div class="msg sys">${esc(m)}</div>`);
    if (!e.text) S.chat.pop(); else S.chat.push({role:"assistant", content:e.text});
  } finally { S.chatBusy = false; const sb = $("#sendBtn"); if (sb){ sb.disabled = false; $("#stopBtn").hidden = true; } }
}
