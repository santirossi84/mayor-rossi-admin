<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("mr:theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Mayor Rossi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D1D1F'/%3E%3Cpath d='M12 48 L28 20 L37 34 L43 26 L54 48 Z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Layout: app de macOS / iOS — barra lateral translúcida, título grande por sección,
   barra de herramientas de vidrio, tarjetas blancas sobre gris del sistema. */
:root{
  color-scheme: light;
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#3A3A3C; --sec:#6E6E73; --ter:#8E8E93;
  --sep:rgba(60,60,67,.12); --sep2:rgba(60,60,67,.22); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --blue:#007AFF; --blue-ink:#0066CC; --green:#248A3D; --green-f:#34C759; --orange:#FF9500; --orange-ink:#C93400;
  --red:#D70015; --red-f:#FF3B30; --purple:#AF52DE; --indigo:#5856D6;
  /* alias que usa el código de la app */
  --void:#FFFFFF; --ice:var(--ink); --mist:var(--sec); --dim:var(--ter); --prizm:var(--blue); --prizm-soft:rgba(0,122,255,.1);
  --mustard:var(--orange); --crit:var(--red-f); --good:var(--green-f); --warn:var(--orange); --frost:var(--purple);
  --line:var(--sep); --line-hi:var(--sep2);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --r:20px; --rs:12px; --gut:clamp(16px,2.6vw,32px);
  --shadow:0 0 0 .5px rgba(0,0,0,.05),0 4px 18px rgba(0,0,0,.045);
  --glass:rgba(250,250,252,.72); --glass-edge:inset 0 .5px 0 rgba(255,255,255,.9),0 0 0 .5px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.08);
  --raised:#FFFFFF; --rail-bg:rgba(240,240,244,.78); --top-bg:rgba(245,245,247,.78); --sheet:rgba(255,255,255,.96); --tcbg:rgba(255,255,255,.75);
  --hover:rgba(0,0,0,.018); --toast:rgba(29,29,31,.92); --g:60,60,67;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --ink2:#D1D1D6; --sec:#98989D; --ter:#6C6C70;
  --sep:rgba(84,84,88,.45); --sep2:rgba(84,84,88,.8); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --blue:#0A84FF; --blue-ink:#409CFF; --green:#30D158; --green-f:#30D158; --orange:#FF9F0A; --orange-ink:#FF9F0A;
  --red:#FF453A; --red-f:#FF453A; --purple:#BF5AF2; --void:#1C1C1E; --prizm-soft:rgba(10,132,255,.18);
  --shadow:0 0 0 .5px rgba(255,255,255,.07); --glass:rgba(40,40,44,.74);
  --glass-edge:inset 0 .5px 0 rgba(255,255,255,.14),0 0 0 .5px rgba(0,0,0,.6),0 8px 28px rgba(0,0,0,.5);
  --raised:#636366; --rail-bg:rgba(28,28,30,.82); --top-bg:rgba(0,0,0,.74); --sheet:rgba(44,44,46,.97); --tcbg:rgba(255,255,255,.06);
  --hover:rgba(255,255,255,.035); --toast:rgba(58,58,60,.95); --g:235,235,245; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --ink2:#D1D1D6; --sec:#98989D; --ter:#6C6C70;
  --sep:rgba(84,84,88,.45); --sep2:rgba(84,84,88,.8); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --blue:#0A84FF; --blue-ink:#409CFF; --green:#30D158; --green-f:#30D158; --orange:#FF9F0A; --orange-ink:#FF9F0A;
  --red:#FF453A; --red-f:#FF453A; --purple:#BF5AF2; --void:#1C1C1E; --prizm-soft:rgba(10,132,255,.18);
  --shadow:0 0 0 .5px rgba(255,255,255,.07); --glass:rgba(40,40,44,.74);
  --glass-edge:inset 0 .5px 0 rgba(255,255,255,.14),0 0 0 .5px rgba(0,0,0,.6),0 8px 28px rgba(0,0,0,.5);
  --raised:#636366; --rail-bg:rgba(28,28,30,.82); --top-bg:rgba(0,0,0,.74); --sheet:rgba(44,44,46,.97); --tcbg:rgba(255,255,255,.06);
  --hover:rgba(255,255,255,.035); --toast:rgba(58,58,60,.95); --g:235,235,245; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.42 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(0,122,255,.45);outline-offset:2px}
.num,td.m,b{font-variant-numeric:tabular-nums}
.gate[hidden],[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 18px;background:var(--rail-bg);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-right:.5px solid var(--sep2)}
.appid{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.appid .ic{width:36px;height:36px;border-radius:9px;background:linear-gradient(160deg,#3A3A3C,#1D1D1F);display:grid;place-items:center;box-shadow:inset 0 .5px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.15)}
.appid .ic svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.appid b{display:block;font-size:15px;font-weight:600}
.appid span{display:block;font-size:12px;color:var(--sec)}
.rail .grp{padding:12px 10px 4px;font-size:11px;font-weight:600;color:var(--sec)}
.rail button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--ink);font-size:14.5px;text-align:left;transition:background .15s}
.rail button svg{width:19px;height:19px;flex:none;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail button[data-v="cabina"] svg{stroke:var(--blue)}.rail button[data-v="retiros"] svg{stroke:var(--green-f)}.rail button[data-v="gastos"] svg{stroke:var(--orange)}
.rail button[data-v="arca"] svg{stroke:var(--red-f)}.rail button[data-v="comisiones"] svg{stroke:var(--purple)}.rail button[data-v="ajustes"] svg{stroke:var(--ter)}
.rail button .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red-f);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.rail button .badge:empty{display:none}
.rail button:hover{background:var(--fill)}
.rail button[aria-current="page"]{background:rgba(0,122,255,.12);color:var(--blue-ink);font-weight:600}
.rail .spacer{flex:1}
.tccard{margin:0 2px;padding:12px 14px;border-radius:14px;background:var(--tcbg);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.07);display:grid;gap:2px}
.tccard span{font-size:12px;color:var(--sec)}
.tccard b{font-size:17px;font-weight:600}

.main{min-width:0;padding-inline:var(--gut);padding-block:0 56px}
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-inline:calc(var(--gut) * -1);padding:calc(12px + env(safe-area-inset-top,0px)) var(--gut) 12px;background:var(--top-bg);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--sep2)}
.topbar .grow{flex:1}
.hud{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;padding-block:14px 14px}
.brand h1{margin:0;font:700 34px/1.1 var(--fd);letter-spacing:-.022em}
.brand p{margin:4px 0 0;color:var(--sec);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;border:0}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ter)}
.chip.live .dot{background:var(--green-f)}
.chip.busy .dot{background:var(--orange)}
.chip.bad{color:var(--red)}.chip.bad .dot{background:var(--red-f)}
.chip.demo{color:var(--orange-ink);background:rgba(255,149,0,.12)}.chip.demo .dot{background:var(--orange)}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{height:28px;padding:0 14px;border:0;border-radius:7px;background:none;font-size:13px;font-weight:500;color:var(--ink2);transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* meses */
.scale{display:flex;gap:4px;overflow-x:auto;padding:4px;margin-bottom:20px;border-radius:14px;background:var(--fill);scrollbar-width:none}
.scale::-webkit-scrollbar{display:none}
.scale button{flex:1 0 auto;display:grid;grid-template-rows:26px auto;justify-items:center;gap:4px;min-width:58px;padding:8px 8px 7px;border:0;border-radius:10px;background:none;color:var(--sec);transition:background .15s}
.scale .alt{width:8px;height:26px;display:flex;align-items:flex-end;border-radius:4px;overflow:hidden;background:var(--fill)}
.scale .alt b{display:block;width:100%;border-radius:4px;background:var(--ter);transition:height .4s}
.scale .alt b.ok{background:var(--blue)}.scale .alt b.low{background:var(--orange)}
.scale span{font-size:12px;font-weight:500;text-transform:capitalize}
.scale button:hover{color:var(--ink)}
.scale button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.04)}
.scale button[aria-pressed="true"] span{font-weight:600}
.scale .all .alt{background:none;align-items:center;justify-content:center;width:auto;font-size:13px;font-weight:600;color:currentColor}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.panel{position:relative;min-width:0;padding:20px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{margin:0;font:600 19px/1.25 var(--fd);letter-spacing:-.012em}
.ph .meta{font-size:13px;color:var(--sec)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1180px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.big{font:700 34px/1.05 var(--fd);letter-spacing:-.02em}
.lbl{font-size:13px;color:var(--sec)}
.sub{font-size:13px;color:var(--sec)}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--orange-ink)}.pz{color:var(--blue-ink)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpi{display:grid;grid-template-rows:auto auto 1fr auto;gap:4px;min-height:164px}
.kpi .v{font:700 28px/1.1 var(--fd);letter-spacing:-.02em}
.kpi svg{width:100%;height:44px;display:block}
.kpi .foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sec)}
.kpi.link{cursor:pointer;transition:transform .15s}
.kpi.link:hover{transform:translateY(-1px)}
@media (max-width:560px){.kpis{grid-template-columns:minmax(0,1fr)}}

.gauge-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
.gauge svg{width:100%;max-width:220px;display:block;margin-inline:auto}
.gstats{display:grid;gap:12px}
.gstats div{display:grid;gap:0}
.gstats b{font:600 22px/1.2 var(--fd);letter-spacing:-.01em}
@media (max-width:560px){.gauge-wrap{grid-template-columns:minmax(0,1fr)}}

.chart svg{width:100%;height:auto;display:block}
.wide{min-width:560px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:3px;vertical-align:0}
.legend i.dash{height:0;border-top:1.5px dashed var(--sec);width:14px;vertical-align:3px;border-radius:0}

/* libro de retiros */
.libro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;align-items:start}
.lh{display:grid;gap:8px;padding:18px;border-radius:16px;background:var(--bg)}
.lh p{margin:0;font-size:14.5px;color:var(--ink2)}
.lh dl{display:grid;gap:8px;margin:6px 0 0;padding-top:12px;border-top:.5px solid var(--sep2)}
.lh dl div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.lh dt{color:var(--sec)}.lh dd{margin:0;font-weight:600}
.lh-top{display:flex;align-items:center;gap:10px}
.seal{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,149,0,.14);color:var(--orange-ink);font-size:12px;font-weight:600}
.seal.ok{background:rgba(52,199,89,.15);color:var(--green)}
table.lib tbody tr{cursor:pointer}
table.lib tr.sel td{background:rgba(0,122,255,.07)}
table.lib tr.now td:first-child::after{content:"en curso";margin-left:8px;padding:2px 7px;border-radius:999px;background:rgba(255,149,0,.14);color:var(--orange-ink);font-size:11px;font-weight:600}
table.lib tfoot td{border-top:.5px solid var(--sep2);border-bottom:0;font-weight:700}
.dv{position:relative;display:block;height:8px;min-width:90px;border-radius:4px;background:var(--fill)}
.dv::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--sep2)}
.dv i{position:absolute;top:0;bottom:0;border-radius:4px}
.dv i.p{left:50%;background:var(--green-f)}.dv i.n{right:50%;background:var(--red-f)}
@media (max-width:900px){.libro{grid-template-columns:minmax(0,1fr)}}

.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.donut svg{width:150px;height:150px}
.dl{display:grid;gap:8px;min-width:0}
.dl div{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.dl i{width:9px;height:9px;border-radius:50%}
.dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
.dl b{font-size:13px;font-weight:500;color:var(--ink2)}
@media (max-width:420px){.donut{grid-template-columns:minmax(0,1fr);justify-items:center}}

.signals{display:grid;gap:0}
.sig{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:.5px solid var(--sep)}
.sig:first-child{border-top:0;padding-top:2px}
.sig .bar{width:10px;height:10px;border-radius:50%;background:var(--ter)}
.sig.warn .bar{background:var(--orange)}.sig.crit .bar{background:var(--red-f)}.sig.ok .bar{background:var(--green-f)}.sig.info .bar{background:var(--blue)}
.sig p{margin:0;font-size:15px;line-height:1.35}
.sig small{display:block;color:var(--sec);font-size:13px;margin-top:1px}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:0;border-radius:999px;background:var(--fill);color:var(--blue-ink);font-size:14px;font-weight:600;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--fill2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:inset 0 .5px 0 rgba(255,255,255,.3),0 2px 8px rgba(0,122,255,.25)}
.btn.primary:hover{background:#0A84FF}
.btn.ghost{background:none;padding:0 8px}
.btn.ghost:hover{background:var(--fill)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

.saldos{display:grid;gap:0}
.saldos div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:.5px solid var(--sep)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.rate div{display:grid;gap:0}
.rate b{font:600 19px var(--fd)}

.bar-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.bar-row .l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:30px;padding:0 13px;border:0;border-radius:999px;background:var(--fill);font-size:13.5px;font-weight:500;color:var(--ink2);text-transform:capitalize;transition:background .15s}
.pill:hover{background:var(--fill2)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{height:34px;width:min(260px,100%);padding:0 14px;border:0;border-radius:10px;background:var(--fill)}
.search::placeholder{color:var(--ter)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.strip .panel{padding:16px 18px}
.strip b{display:block;font:700 24px/1.15 var(--fd);letter-spacing:-.015em;margin-top:2px}
@media (max-width:820px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--sec);padding:8px 10px;border-bottom:.5px solid var(--sep2);white-space:nowrap}
td{padding:10px;border-bottom:.5px solid var(--sep);vertical-align:middle}
tbody tr:hover td{background:var(--hover)}
td.r,th.r{text-align:right}
td.m{white-space:nowrap;font-weight:500}
td.d{color:var(--sec);white-space:nowrap;font-size:13.5px}
td .note{display:block;font-size:12.5px;color:var(--ter);font-weight:400;margin-top:1px}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:500;color:var(--ink2);text-transform:capitalize;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%}
.tag.cash{background:rgba(255,149,0,.13);color:var(--orange-ink)}
.sw{position:relative;width:51px;height:31px;border:0;border-radius:999px;background:var(--fill2);padding:0;vertical-align:middle;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.sw[aria-checked="true"]{background:var(--green-f)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.sw-l{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.na{font-size:13px;color:var(--ter)}
.acts{display:flex;gap:2px;justify-content:flex-end}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--ter)}
.ib:hover{background:var(--fill);color:var(--blue-ink)}
.ib.armed{width:auto;padding:0 12px;border-radius:999px;background:var(--red-f);color:#fff;font-size:12.5px;font-weight:600}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:30px 10px;text-align:center;color:var(--sec);font-size:14.5px}
.empty b{display:block;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:4px}

.rank{display:grid;gap:11px}
.rank div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14.5px}
.rank span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.heat{display:grid;gap:4px;min-width:560px}

.trail{position:relative;margin:38px 0 56px}
.trail .track{position:relative;height:12px;border-radius:999px;background:var(--fill);overflow:hidden}
.trail .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--blue)}

.trail .tick{position:absolute;top:-34px;transform:translateX(-50%);display:grid;justify-items:center;gap:4px}
.trail .tick span{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--raised);box-shadow:0 0 0 .5px var(--sep2),0 1px 3px rgba(0,0,0,.08)}
.trail .tick span b{font-size:11.5px;font-weight:600}
.trail .tick.cur span{background:var(--blue);color:#fff;box-shadow:none}
.trail .tick::after{content:"";width:1px;height:24px;background:var(--sep2)}
.trail .tick em{position:absolute;top:58px;font-size:12px;font-style:normal;color:var(--sec);white-space:nowrap}
.cats{display:grid}
.cats div{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:10px;padding:8px 10px;border-bottom:.5px solid var(--sep);font-size:14px;border-radius:8px}
.cats div.cur{background:rgba(0,122,255,.1)}

.cats b{font-weight:700}
.pend-m{margin-top:16px}
.pend-m h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--orange-ink)}

.form{display:grid;gap:14px}
.f{display:grid;gap:6px}

.f input,.f select,.f textarea{height:40px;padding:0 12px;border:0;border-radius:10px;background:var(--fill);min-width:0;width:100%}
.f textarea{height:74px;padding:9px 12px;resize:vertical}
.f small{color:var(--ter);font-size:12.5px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.tcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 150px 34px;gap:8px;align-items:center}
@media (max-width:480px){.f2{grid-template-columns:minmax(0,1fr)}.srow{grid-template-columns:minmax(0,1fr) 110px 34px}}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.25);backdrop-filter:blur(2px);animation:fade .2s}
.drawer{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;padding:24px;border-radius:24px;background:var(--sheet);backdrop-filter:blur(30px);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 30px 80px rgba(0,0,0,.25);animation:pop .25s cubic-bezier(.3,.7,.3,1)}
.drawer h3{margin:0 0 2px;font:700 22px var(--fd);letter-spacing:-.015em}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}}
.err{color:var(--red);font-size:13.5px;min-height:18px}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;background:var(--toast);backdrop-filter:blur(20px);color:#fff;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.bad{background:rgba(215,0,21,.95)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 16px;margin-bottom:18px;border-radius:14px;background:rgba(255,149,0,.12);font-size:14.5px}
.banner b{color:var(--orange-ink);font-weight:600}
.banner.info{background:rgba(0,122,255,.09)}.banner.info b{color:var(--blue-ink)}
.loading{padding:80px 10px;text-align:center;color:var(--sec)}
.spin{width:22px;height:22px;margin:0 auto 12px;border-radius:50%;border:2.5px solid var(--fill2);border-top-color:var(--sec);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.foot-note{margin-top:16px;font-size:12.5px;color:var(--ter)}
.plan{display:grid;gap:4px;margin-top:4px;padding:12px 14px;border-radius:12px;background:rgba(0,122,255,.1)}

.lote{position:sticky;top:64px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;border-radius:14px;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--glass-edge)}

<script>
(() => {
"use strict";

/* ===================== constantes ===================== */
// Escala Monotributo vigente desde agosto 2026 (tope anual, cuota mensual servicios)
const MONO = {A:[12009410,49527.18],B:[17595182,56379],C:[24670494,66020],D:[30628651,84614],E:[36028231,119811],F:[45151659,150784],G:[53995798,230612],H:[81924660,522706],I:[91699761,963747],J:[105012519,1167299],K:[126610830,1614446.02]};
const CATC = {comida:"#FF9500",ropa:"#FF2D55",salud:"#5AC8FA",generales:"#8E8E93",impuestos:"#FF3B30","gastos bancarios":"#A2845E",ganancias:"#34C759"};
const EXTRA = ["#5856D6","#FFCC00","#30B0C7","#AF52DE"];
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DEF_CFG = {objetivo:1500000, tc:{}, saldos:[], monotributo:"A"};
const DEF_TC = 1500;
const NOW = new Date();
const CUR_YM = NOW.getFullYear()+"-"+String(NOW.getMonth()+1).padStart(2,"0");

const K = {ink:"#1D1D1F", sec:"#6E6E73", ter:"#8E8E93", card:"#FFFFFF", g:"60,60,67"};
function readK(){ try { const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  K.ink = v("--ink") || K.ink; K.sec = v("--sec") || K.sec; K.ter = v("--ter") || K.ter; K.card = v("--card") || K.card; K.g = v("--g") || K.g; } catch(e){} }
const ls = {get(k){try{return localStorage.getItem("mr:"+k)}catch(e){return null}}, set(k,v){try{localStorage.setItem("mr:"+k,v)}catch(e){}}};
const S = {
  retiros:[], gastos:[], comisiones:[], config:null,
  mode:"loading", rev:0, clave:"", sync:"", dl:true, pendingImport:null,
  cur: ls.get("cur")==="ARS"?"ARS":"USD",
  view: "cabina", sel:null,
  fRet:"todos", fGas:"todas", qRet:"", qGas:"", donut:"mes", incl5:true,
  chat:[], chatBusy:false, ctl:null
};
const SELF = new Set();
const VIEWS = ["cabina","retiros","gastos","arca","comisiones","ajustes"];
const TITLES = {cabina:"Resumen",retiros:"Retiros",gastos:"Gastos",arca:"ARCA",comisiones:"Cobros 5%",ajustes:"Ajustes"};
if (VIEWS.includes(location.hash.slice(1))) S.view = location.hash.slice(1);
else { const v = ls.get("view"); if (VIEWS.includes(v)) S.view = v; }

/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cfg = () => Object.assign({}, DEF_CFG, S.config || {});
const ymOf = f => String(f||"").slice(0,7);
const ymLabel = ym => { const [y,m] = ym.split("-"); return MES[+m-1]+" "+y.slice(2); };
const ymLong = ym => { const [y,m] = ym.split("-"); return MESL[+m-1]+" "+y; };
const ddmm = f => f ? f.slice(8,10)+"/"+f.slice(5,7) : "—";
const addM = (ym,n) => { let [y,m] = ym.split("-").map(Number); m += n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+"-"+String(m).padStart(2,"0"); };
const mDiff = (a,b) => { const [ya,ma]=a.split("-").map(Number), [yb,mb]=b.split("-").map(Number); return (yb-ya)*12+(mb-ma); };
const catColor = (() => { const extra = {}; let i = 0; return c => CATC[c] || extra[c] || (extra[c] = EXTRA[(i++)%EXTRA.length]); })();

/* Cotización: dólar oficial BNA, venta, de cada día. Ajustes permite fijar un mes a mano. */
const TCD = {days:{}, keys:[], avg:{}, today:0, at:""};
function tcIndex(){
  TCD.keys = Object.keys(TCD.days).sort(); TCD.avg = {};
  const acc = {}; for (const k of TCD.keys){ const m = k.slice(0,7); (acc[m] = acc[m] || []).push(TCD.days[k]); }
  for (const m in acc) TCD.avg[m] = acc[m].reduce((a,b) => a+b, 0) / acc[m].length;
}
function tcAuto(f){
  const L = TCD.keys; if (!L.length) return 0;
  if (TCD.days[f]) return TCD.days[f];
  let lo = 0, hi = L.length - 1, best = -1;
  while (lo <= hi){ const mid = (lo + hi) >> 1; if (L[mid] <= f){ best = mid; lo = mid + 1; } else hi = mid - 1; }
  return best >= 0 ? TCD.days[L[best]] : 0;
}
function tcManual(ym){ const t = cfg().tcManual || {}; return +t[ym] || 0; }
function tcFallback(ym){
  const t = cfg().tc || {}; if (t[ym]) return +t[ym];
  const ks = Object.keys(t).filter(k => +t[k] > 0).sort();
  if (!ks.length) return DEF_TC;
  let best = null; for (const k of ks) if (k <= ym) best = k;
  return +t[best || ks[0]];
}
function tcFor(ym){
  const m = tcManual(ym); if (m) return m;
  if (TCD.avg[ym]) return TCD.avg[ym];
  return tcAuto(ym + "-31") || tcFallback(ym);
}
function tcDay(f){
  const ym = ymOf(f), m = tcManual(ym); if (m) return m;
  if (TCD.today && TCD.keys.length && f > TCD.keys[TCD.keys.length-1]) return TCD.today;
  return tcAuto(f) || tcFallback(ym);
}
async function loadTC(){
  try { const c = JSON.parse(localStorage.getItem("mayor_rossi_tc") || "null");
    if (c && c.days){ TCD.days = c.days; TCD.today = c.today || 0; TCD.at = c.at || ""; tcIndex(); }
    if (c && c.at && Date.now() - c.at < 6*36e5) return; } catch(e){}
  try {
    const r = await fetch("https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial", {cache:"no-store"});
    if (r.ok){ const arr = await r.json(); const d = {};
      for (const x of arr) if (x && x.fecha && x.fecha >= "2025-01-01" && +x.venta > 0) d[x.fecha] = +x.venta;
      if (Object.keys(d).length) TCD.days = d; }
  } catch(e){}
  try { const r = await fetch("https://dolarapi.com/v1/dolares/oficial", {cache:"no-store"});
    if (r.ok){ const j = await r.json(); if (+j.venta > 0){ TCD.today = +j.venta; const f = (j.fechaActualizacion || "").slice(0,10) || NOW.toISOString().slice(0,10); TCD.days[f] = +j.venta; } } } catch(e){}
  tcIndex(); TCD.at = Date.now();
  try { localStorage.setItem("mayor_rossi_tc", JSON.stringify({days:TCD.days, today:TCD.today, at:TCD.at})); } catch(e){}
  if (S.mode !== "loading") render();
}
const val = (ars, ym) => S.cur === "USD" ? ars / tcFor(ym) : ars;
const nf0 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(v, cur){ cur = cur || S.cur; const a = Math.abs(v); const f = cur==="USD" ? (a<100?nf2:nf0) : (a<1000?nf2:nf0); return (v<0?"−":"")+(cur==="USD"?"US$ ":"$ ")+f.format(a); }

/* ===================== modelo ===================== */
function months(){
  const all = [...S.retiros, ...S.gastos, ...S.comisiones].map(r => ymOf(r.fecha)).filter(x => /^\d{4}-\d{2}$/.test(x)).sort();
  let a = all[0] || addM(CUR_YM,-5), b = all[all.length-1] || CUR_YM;
  if (CUR_YM > b) b = CUR_YM;
  const out = []; for (let m = a; m <= b; m = addM(m,1)) out.push(m);
  return out.slice(-18);
}
function blank(){ return {ret:0,retT:0,retE:0,gas:0,ing:0,cat:{},sinFac:0,sinFacN:0,fac:0,com:0,comBase:0,comFac:0,n:0}; }
function build(){
  const M = {}; const mk = ym => M[ym] || (M[ym] = Object.assign(blank(), {u: blank()}));
  const add = (o, f, fn) => { fn(o, 1); fn(o.u, 1 / tcDay(f)); };
  for (const r of S.retiros){ const o = mk(ymOf(r.fecha)), v = +r.importe||0;
    add(o, r.fecha, (x, k) => { x.ret += v*k; x.n++;
      if (r.tipo === "efectivo") x.retE += v*k; else { x.retT += v*k; if (r.facturado) x.fac += v*k; else { x.sinFac += v*k; x.sinFacN++; } } }); }
  for (const g of S.gastos){ const o = mk(ymOf(g.fecha)), v = +g.importe||0, c = g.categoria || "sin categoría";
    add(o, g.fecha, (x, k) => { x.n++; if (v >= 0){ x.gas += v*k; x.cat[c] = (x.cat[c]||0) + v*k; } else x.ing += -v*k; }); }
  for (const c of S.comisiones){ const o = mk(ymOf(c.fecha)), v = +c.importe||0;
    add(o, c.fecha, (x, k) => { x.comBase += v*k; x.com += v*(+c.tasa||0.05)*k; if (c.facturado) x.comFac += v*k; }); }
  return M;
}
const Z = Object.assign(blank(), {u: blank()});
const cv = o => S.cur === "USD" ? o.u : o;
const at = (M, ym) => M[ym] || Z;
function inSel(f){ return S.sel === "all" || ymOf(f) === S.sel; }
function sumConv(M, ms, fn){ let s = 0; for (const m of ms) s += fn(cv(at(M,m))); return s; }
function selMonths(ms){ return S.sel === "all" ? ms : [S.sel]; }
function lastDataMonth(){
  const all = [...S.retiros, ...S.gastos].map(r => ymOf(r.fecha)).filter(m => m <= CUR_YM).sort();
  return all[all.length-1] || CUR_YM;
}
function factWindow(){
  // facturación de los últimos 12 meses (ARS), base para el Monotributo
  const from = addM(CUR_YM,-11); let tot = 0; const first = [];
  for (const r of S.retiros) if (r.tipo !== "efectivo" && r.facturado && ymOf(r.fecha) >= from && ymOf(r.fecha) <= CUR_YM){ tot += +r.importe||0; first.push(ymOf(r.fecha)); }
  if (S.incl5) for (const c of S.comisiones) if (c.facturado && ymOf(c.fecha) >= from && ymOf(c.fecha) <= CUR_YM){ tot += +c.importe||0; first.push(ymOf(c.fecha)); }
  first.sort();
  const start = first[0] || CUR_YM; const prev = addM(CUR_YM,-1);
  const n = Math.max(1, mDiff(start, prev) + 1);
  return {tot, proj: tot / n * 12, n, start};
}

/* libro de retiros: subtotal mensual, diferencia contra el sueldo y diferencia acumulada (en pesos, como la planilla) */

function loteBar(pend){
  for (const id of [...SELF]) if (!pend.some(r => r.id === id)) SELF.delete(id);
  if (!pend.length) return "";

  return `<div class="lote">${sel.length ? `<b>${sel.length} seleccionada${sel.length>1?"s":""} · ${ars(tot)}</b>` : `<span class="sub">Tildá las que vas a facturar, o elegí un mes entero.</span>`}<span class="grow"></span>

    <button class="btn primary" data-act="facLote" ${sel.length ? "" : "disabled"}>Marcar facturadas</button></div>`;

function factBars(rows, mx){
  if (!rows.length) return "";
  const W = 760, H = 150, l = 56, r = 10, t = 8, b = 22, n = rows.length, bw = (W-l-r)/n, step = niceStep(mx/3), top = Math.ceil(mx/step)*step, y = v => t + (H-t-b) - v/top*(H-t-b);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Facturado y pendiente por mes">`;
  for (let v = 0; v <= top+1e-9; v += step) s += `<line x1="${l}" x2="${W-r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="rgba(${K.g},${v?.08:.3})"/><text x="${l-8}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="9.5" fill="${K.ter}">${compact(v,"ARS")}</text>`;
  rows.forEach((o,i) => { const x = l + i*bw + bw*.22, w = bw*.56;
    s += `<rect x="${x.toFixed(1)}" y="${y(o.f).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(0)-y(o.f)).toFixed(1)}" fill="#007AFF" opacity=".8"><title>${ymLong(o.m)} facturado ${ars(o.f)}</title></rect>`;
    if (o.p) s += `<rect x="${x.toFixed(1)}" y="${y(o.f+o.p).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(o.f)-y(o.f+o.p)).toFixed(1)}" fill="none" stroke="#AF52DE" stroke-dasharray="3 2"><title>${ymLong(o.m)} sin facturar ${ars(o.p)}</title></rect>`;
    s += `<text x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="10" fill="${K.sec}">${ymLabel(o.m).toUpperCase()}</text>`; });
  return s + `<text x="${W-r}" y="${t+8}" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="9.5" fill="#AF52DE">punteado = sin facturar</text></svg>`;
}

let pendingRender = false;
function render(force){
  const ae = document.activeElement;
  if (!force && ae && $("#view").contains(ae) && ae.matches("input,select,textarea")) { pendingRender = true; return; }
  pendingRender = false;
  if (S.mode === "loading") return;
  readK();
  const ms = months(), M = build();
  if (!S.sel || (S.sel !== "all" && !ms.includes(S.sel))) S.sel = lastDataMonth();
  renderChrome(M, ms);
  const v = $("#view");
  v.innerHTML = S.view === "retiros" ? vRetiros(M, ms) : S.view === "gastos" ? vGastos(M, ms) : S.view === "arca" ? vArca(M, ms)
    : S.view === "comisiones" ? vComis(M, ms) : S.view === "ajustes" ? vAjustes(ms) : vCabina(M, ms);
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !( $("#view").contains(document.activeElement) && document.activeElement.matches("input,select,textarea"))) render(); }, 0));

/* ===================== escritura ===================== */
function toast(msg, bad){ const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.setAttribute("role","status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const errMsg = e => e && e.code === "quota_exceeded" ? "Se llenó el espacio del tablero; borrá registros viejos." : e && e.code === "invalid_argument" ? "No tenés permiso para guardar en este tablero." : "No se pudo guardar. Probá de nuevo.";
const listOf = col => S[col];
async function put(col, id, data){ const L = listOf(col); const i = L.findIndex(r => r.id === id); const rec = Object.assign({id}, data); if (i >= 0) L[i] = rec; else L.push(rec); changed(); }
async function patch(col, id, data){ const r = listOf(col).find(r => r.id === id); if (r) Object.assign(r, data); changed(); }
async function remove(col, id){ const L = listOf(col); const i = L.findIndex(r => r.id === id); if (i >= 0) L.splice(i, 1); changed(); }
async function saveCfg(next){ S.config = next; changed(); }

/* ===================== sincronización con la nube ===================== */
const API = "/api/datos", CACHE = "mayor_rossi_v1", KEY = "mayor_rossi_clave";
let saveT = null, saving = false, dirty = false;
const snapshot = () => ({retiros:S.retiros, gastos:S.gastos, comisiones:S.comisiones, config:S.config || DEF_CFG});
function cacheLocal(){ try { localStorage.setItem(CACHE, JSON.stringify({rev:S.rev, data:snapshot()})); } catch(e){} }
function setSync(t){ S.sync = t; const st = $("#status"); if (!st || S.mode !== "live") return;
  st.className = "chip " + (t === "Guardado" ? "live" : t === "Guardando…" ? "busy" : "bad"); st.lastElementChild.textContent = t; }
function api(method, body){ return fetch(API, {method, cache:"no-store", headers:{"content-type":"application/json","x-clave":S.clave}, body: body ? JSON.stringify(body) : undefined}); }
function changed(){ render(true); if (S.mode !== "live") return; cacheLocal(); dirty = true; setSync("Guardando…"); clearTimeout(saveT); saveT = setTimeout(flush, 700); }
async function flush(){
  if (saving){ clearTimeout(saveT); saveT = setTimeout(flush, 400); return; }
  if (!dirty || S.mode !== "live") return;
  saving = true; dirty = false;
  try {
    const r = await api("PUT", {rev:S.rev, data:snapshot()}); const j = await r.json().catch(() => ({}));
    if (r.status === 409){ load(j); setSync("Guardado"); toast("Había cambios desde otro dispositivo y se cargaron. Revisá tu último cambio.", true); }
    else if (r.status === 401){ dirty = true; logout("La clave cambió. Volvé a entrar."); }
    else if (!r.ok){ dirty = true; setSync("Sin guardar"); toast(j.error || "No se pudo guardar. Tocá el estado para reintentar.", true); }
    else { S.rev = j.rev; cacheLocal(); setSync(dirty ? "Guardando…" : "Guardado"); }
  } catch(e){ dirty = true; setSync("Sin guardar"); toast("Sin conexión. El cambio quedó en este dispositivo; tocá el estado para reintentar.", true); }
  finally { saving = false; if (dirty && S.sync === "Guardando…"){ clearTimeout(saveT); saveT = setTimeout(flush, 500); } }
}
function load(doc){
  const d = (doc && doc.data) || {};
  S.rev = +(doc && doc.rev) || 0;
  S.retiros = Array.isArray(d.retiros) ? d.retiros : []; S.gastos = Array.isArray(d.gastos) ? d.gastos : [];
  S.comisiones = Array.isArray(d.comisiones) ? d.comisiones : []; S.config = d.config || null;
  cacheLocal(); render(true);
}
function logout(msg){ try { localStorage.removeItem(KEY); localStorage.removeItem(CACHE); } catch(e){}
  S.clave = ""; S.mode = "loading"; S.retiros = []; S.gastos = []; S.comisiones = []; S.config = null; showGate(msg || ""); }
function showGate(msg){ $("#gate").hidden = false; $("#gateErr").textContent = msg || ""; setTimeout(() => $("#gateKey").focus(), 50); }
async function enter(clave){
  S.clave = clave;
  const r = await api("GET");
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error("Clave incorrecta.");
  if (!r.ok) throw new Error(j.error || "No se pudo conectar.");
  try { localStorage.setItem(KEY, clave); } catch(e){}
  S.mode = "live"; $("#gate").hidden = true;
  if (j.vacio) load({rev:0, data:{}}); else load(j);
  setSync("Guardado");
}
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

function openForm(col, id){
  const rec = id ? listOf(col).find(r => r.id === id) : null, today = NOW.toISOString().slice(0,10);
  const r = rec || {fecha: S.sel && S.sel !== "all" && S.sel !== CUR_YM ? S.sel+"-01" : today, importe:"", tipo:"transferencia", facturado:false, tasa:.05, compensado:false, categoria:"", nota:""};
  const clients = [...new Set([...S.retiros, ...S.comisiones].map(x => x.cliente).filter(Boolean))].sort();
  const cats = [...new Set([...Object.keys(CATC), ...S.gastos.map(g => g.categoria).filter(Boolean)])];
  const title = {retiros:"retiro", gastos:"gasto", comisiones:"cobro con comisión"}[col];

    <div class="f"><label for="fImp">Importe (ARS)</label><input id="fImp" type="number" step="0.01" required value="${r.importe===""?"":+r.importe}" inputmode="decimal"></div></div>`;
  if (col === "retiros") fields += `<div class="f"><label for="fCli">Cliente</label><input id="fCli" list="dlCli" required value="${esc(r.cliente||"")}" autocomplete="off"><datalist id="dlCli">${clients.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div>
    <div class="f"><label for="fTipo">Tipo</label><select id="fTipo"><option value="transferencia" ${r.tipo!=="efectivo"?"selected":""}>Transferencia de cliente</option><option value="efectivo" ${r.tipo==="efectivo"?"selected":""}>Retiro en efectivo</option></select></div>
    <label class="chk"><input id="fFac" type="checkbox" ${r.facturado?"checked":""}> Ya está facturado en ARCA</label>`;
  if (col === "gastos") fields += `<div class="f"><label for="fCon">Concepto</label><input id="fCon" required value="${esc(r.concepto||"")}"></div>
    <div class="f"><label for="fCat">Categoría</label><input id="fCat" list="dlCat" required value="${esc(r.categoria||"")}" autocomplete="off"><datalist id="dlCat">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist><small>Importe negativo = ingreso o reintegro.</small></div>`;
  if (col === "comisiones") fields += `<div class="f"><label for="fCli">Cliente</label><input id="fCli" list="dlCli" required value="${esc(r.cliente||"")}" autocomplete="off"><datalist id="dlCli">${clients.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div>
    <div class="f2"><div class="f"><label for="fTasa">Comisión (%)</label><input id="fTasa" type="number" step="0.1" min="0" value="${((+r.tasa||.05)*100).toFixed(1)}"></div>
    <div class="f"><label for="fCompF">Fecha de compensación</label><input id="fCompF" type="date" value="${esc(r.compensadoFecha||"")}"></div></div>
    <label class="chk"><input id="fFac" type="checkbox" ${r.facturado?"checked":""}> Facturado</label><label class="chk"><input id="fComp" type="checkbox" ${r.compensado?"checked":""}> Compensado</label>`;
  fields += `<div class="f"><label for="fNota">Nota</label><textarea id="fNota">${esc(r.nota||"")}</textarea></div>`;
  $("#layer").innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h3 id="dTitle">${id ? "Editar" : "Nuevo"} ${title}</h3><p class="sub" style="margin:0 0 18px">${S.mode==="demo"?"Modo demo: el cambio no se guarda.":"Se guarda al instante en tu tablero."}</p>
    <form class="form" id="frm" novalidate>${fields}<div class="err" id="fErr"></div>

  const frm = $("#frm"); setTimeout(() => (col === "gastos" ? $("#fCon") : $("#fCli") || $("#fImp")).focus(), 30);
  frm.addEventListener("submit", async ev => {
    ev.preventDefault();
    const g = s => frm.querySelector(s), fecha = g("#fFecha").value, imp = parseFloat(String(g("#fImp").value).replace(",","."));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return $("#fErr").textContent = "Cargá una fecha válida.";
    if (!isFinite(imp) || imp === 0) return $("#fErr").textContent = "El importe tiene que ser un número distinto de cero.";
    let data;
    if (col === "retiros"){ const cli = g("#fCli").value.trim(); if (!cli) return $("#fErr").textContent = "Falta el cliente.";
      if (imp < 0) return $("#fErr").textContent = "Un retiro no puede ser negativo.";

    if (col === "gastos"){ const con = g("#fCon").value.trim(), cat = g("#fCat").value.trim().toLowerCase(); if (!con || !cat) return $("#fErr").textContent = "Completá concepto y categoría.";

    catch(e){ btn.disabled = false; $("#fErr").textContent = errMsg(e); }
  });
}

/* ===================== copiloto ===================== */
function context(){
  const ms = months(), M = build(), c = cfg(), fw = factWindow();
  const lines = ms.map(m => { const o = at(M,m); return `${m}: TC ${tcFor(m)} | retiros ARS ${Math.round(o.ret)} (transf ${Math.round(o.retT)}, efectivo ${Math.round(o.retE)}) | gastos ARS ${Math.round(o.gas)} | ingresos extra ARS ${Math.round(o.ing)} | sin facturar ARS ${Math.round(o.sinFac)} (${o.sinFacN}) | categorías ${Object.entries(o.cat).map(([k,v]) => k+" "+Math.round(v)).join(", ")}`; });
  const pend = S.retiros.filter(r => r.tipo !== "efectivo" && !r.facturado).map(r => `${r.fecha} ${r.cliente} ARS ${r.importe}`);
  const gas = S.gastos.slice().sort((a,b) => a.fecha < b.fecha ? -1 : 1).map(g => `${g.fecha} ${g.concepto} [${g.categoria}] ARS ${g.importe}`);
  return `Datos del tablero personal (hoy ${NOW.toISOString().slice(0,10)}).
Objetivo de retiro mensual: ARS ${c.objetivo}. Monotributo categoría ${c.monotributo} (tope anual ARS ${MONO[c.monotributo][0]}, cuota ARS ${MONO[c.monotributo][1]}). Facturado últimos 12 meses ARS ${Math.round(fw.tot)}, proyección anual ARS ${Math.round(fw.proj)}.
Saldos: ${(c.saldos||[]).map(s => s.nombre+" ARS "+s.importe).join(", ") || "sin datos"}.
RESUMEN MENSUAL:
${lines.join("\n")}
TRANSFERENCIAS SIN FACTURAR:
${pend.join("\n") || "ninguna"}
GASTOS (detalle):
${gas.join("\n")}`.slice(0, 60000);
}
async function ask(q){
  q = (q||"").trim(); if (!q || S.chatBusy) return;
  const log = $("#log"); if (!log) return;
  if (!S.sample){ log.insertAdjacentHTML("beforeend", `<div class="msg sys">El copiloto no está disponible en esta vista.</div>`); return; }
  if (!S.chat.length) log.innerHTML = "";
  S.chat.push({role:"user", content:q});
  log.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div>`);
  const bub = document.createElement("div"); bub.className = "msg ai"; bub.textContent = "Pensando…"; log.appendChild(bub); log.scrollTop = log.scrollHeight;
  $("#ask").value = ""; S.chatBusy = true; $("#sendBtn").disabled = true; $("#stopBtn").hidden = false;
  const RULES = `Sos el copiloto financiero de Santi, que administra su sueldo retirando transferencias de clientes de la pinturería familiar. Respondé en español rioplatense, cercano y profesional, breve y concreto (máximo 180 palabras salvo que pida detalle). Expresá los análisis en USD usando el TC de cada mes, salvo temas impositivos (ARCA, Monotributo) que van en pesos. Usá solo los datos de abajo; si algo no está, decilo. No uses markdown con tablas; listas cortas con guiones están bien.\n\n${context()}`;
  S.ctl = new AbortController();
  try {
    const turns = [{role:"user", content:RULES}, ...S.chat.slice(-10)];
    const { text } = await S.sample(turns, {cache:false, signal:S.ctl.signal, onText:({text}) => { bub.textContent = text; log.scrollTop = log.scrollHeight; }});
    S.chat.push({role:"assistant", content:text});
  } catch(e){
    bub.textContent = e.text || "";
    const m = {not_granted:"No diste permiso para usar Claude desde este tablero.", rate_limited:"Muchas consultas seguidas. Probá en un rato.", sampling_disabled:"Claude no está disponible para esta cuenta.", session_expired:"Tu sesión venció: volvé a iniciar sesión.", cancelled:""}[e.code] ?? "Se cortó la respuesta. Probá de nuevo.";
    if (m) log.insertAdjacentHTML("beforeend", `<div class="msg sys">${esc(m)}</div>`);
    if (!e.text) S.chat.pop(); else S.chat.push({role:"assistant", content:e.text});
  } finally { S.chatBusy = false; const sb = $("#sendBtn"); if (sb){ sb.disabled = false; $("#stopBtn").hidden = true; } }
}

/* ===================== resumen PDF ===================== */
function printResumen(){
  const ms = months(), M = build(), c = cfg(), single = S.sel !== "all", SM = selMonths(ms), obj = c.objetivo;
  const cur = S.cur, U = cur === "USD";
  const per = single ? ymLong(S.sel) : "Todo el período";
  const ret = sumConv(M, SM, o => o.ret), gas = sumConv(M, SM, o => o.gas), ing = sumConv(M, SM, o => o.ing);
  const objC = SM.reduce((a,m) => a + val(obj, m), 0), lib = libroRows(M, ms).filter(x => !single || x.m <= S.sel);
  const last = lib[lib.length-1] || {acc:0};
  const cat = {}; for (const m of SM) for (const [k,v] of Object.entries(cv(at(M,m)).cat)) cat[k] = (cat[k]||0) + v;
  const cats = Object.entries(cat).sort((a,b) => b[1]-a[1]);
  const rr = S.retiros.filter(r => inSel(r.fecha)).sort((a,b) => a.fecha < b.fecha ? -1 : 1);
  const gg = S.gastos.filter(g => inSel(g.fecha)).sort((a,b) => a.fecha < b.fecha ? -1 : 1);
  const pend = S.retiros.filter(r => r.tipo !== "efectivo" && !r.facturado), ptot = pend.reduce((a,r) => a + (+r.importe||0), 0);
  const fw = factWindow(), cat0 = c.monotributo || "A";
  const tcTxt = U ? (single ? `Dólar oficial BNA venta de cada operación (promedio ${ymLabel(S.sel)}: $ ${nf0.format(tcFor(S.sel))}).` : "Dólar oficial BNA venta de cada operación.") : "Montos en pesos.";
  $("#print").innerHTML = `
    <h1>Mayor Rossi · ${esc(per)}</h1>
    <div class="meta">Resumen de finanzas personales · emitido el ${NOW.toLocaleDateString("es-AR")} · ${esc(tcTxt)}</div>
    <div class="kp"><div><span>Sueldo retirado</span><b>${fmt(ret)}</b></div><div><span>Le corresponde</span><b>${fmt(objC)}</b></div>
      <div><span>Gastos</span><b>${fmt(gas)}</b></div><div><span>Ahorro neto</span><b class="${ret+ing-gas>=0?"pos":"neg"}">${fmt(ret+ing-gas)}</b></div></div>
    <h2>Libro de retiros (pesos)</h2>
    <table><thead><tr><th>Mes</th><th class="r">Retirado</th><th class="r">Diferencia a sueldo</th><th class="r">Dif. acumulada</th></tr></thead><tbody>
      ${lib.map(x => `<tr><td>${ymLong(x.m)}</td><td class="r">${ars(x.r)}</td><td class="r ${x.d>=0?"pos":"neg"}">${ars(x.d)}</td><td class="r ${x.acc>=0?"pos":"neg"}"><b>${ars(x.acc)}</b></td></tr>`).join("")}
    </tbody></table>
    <p class="meta">${last.acc < 0 ? `Pendiente de retirar al cierre: ${ars(-last.acc)}.` : `Adelantado al cierre: ${ars(last.acc)}.`}</p>
    <h2>Gastos por categoría</h2>
    <table><thead><tr><th>Categoría</th><th class="r">Importe</th><th class="r">%</th></tr></thead><tbody>
      ${cats.map(([k,v]) => `<tr><td style="text-transform:capitalize">${esc(k)}</td><td class="r">${fmt(v)}</td><td class="r">${pct(v/(gas||1))}</td></tr>`).join("") || `<tr><td colspan="3">Sin gastos</td></tr>`}
      ${ing ? `<tr><td>Ingresos y reintegros</td><td class="r pos">−${fmt(ing)}</td><td></td></tr>` : ""}
    </tbody></table>
    <h2>Retiros del período</h2>
    <table><thead><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th class="r">Importe</th><th>Factura</th></tr></thead><tbody>
      ${rr.map(r => `<tr><td>${ddmm(r.fecha)}</td><td>${esc(r.cliente)}</td><td>${r.tipo === "efectivo" ? "Efectivo" : "Transferencia"}</td><td class="r">${ars(+r.importe||0)}</td><td>${r.tipo === "efectivo" ? "—" : r.facturado ? "Sí" : "Pendiente"}</td></tr>`).join("") || `<tr><td colspan="5">Sin retiros</td></tr>`}
    </tbody></table>
    <h2>Gastos del período</h2>
    <table><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th class="r">Importe</th></tr></thead><tbody>
      ${gg.map(g => `<tr><td>${ddmm(g.fecha)}</td><td>${esc(g.concepto)}</td><td style="text-transform:capitalize">${esc(g.categoria)}</td><td class="r">${ars(+g.importe||0)}</td></tr>`).join("") || `<tr><td colspan="4">Sin gastos</td></tr>`}
    </tbody></table>
    <h2>ARCA y Monotributo (pesos)</h2>
    <table><tbody>
      <tr><td>Transferencias sin facturar (total)</td><td class="r">${pend.length} · ${ars(ptot)}</td></tr>

      <tr><td>Tope categoría ${cat0}</td><td class="r">${ars(MONO[cat0][0])} · usado ${pct(fw.tot/MONO[cat0][0],1)}</td></tr>
      <tr><td>Proyección a 12 meses</td><td class="r">${ars(fw.proj)} · categoría ${fitCat(fw.proj)}</td></tr>
    </tbody></table>
    <div class="foot">Mayor Rossi · escala de Monotributo vigente desde agosto 2026.</div>`;

/* ===================== export ===================== */
async function exportCSV(col){
  const L = listOf(col).slice().sort((a,b) => a.fecha < b.fecha ? -1 : 1);
  const cols = col === "retiros" ? ["fecha","cliente","importe","tipo","facturado","nota"] : col === "gastos" ? ["fecha","concepto","importe","categoria","nota"] : ["fecha","cliente","importe","tasa","facturado","compensado","compensadoFecha","nota"];
  const q = v => { v = v === undefined || v === null ? "" : String(v); return /[",;\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv = "\uFEFF" + [cols.join(";"), ...L.map(r => cols.map(k => q(typeof r[k] === "number" ? String(r[k]).replace(".",",") : r[k])).join(";"))].join("\n");
  download(`mayor-rossi-${col}-${NOW.toISOString().slice(0,10)}.csv`, csv, "text/csv;charset=utf-8");
}

  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "view"){ S.view = el.dataset.v; ls.set("view", S.view); try { history.replaceState(null, "", "#"+S.view); } catch(e){} render(true); window.scrollTo({top:0}); if (S.view === "copiloto") setTimeout(() => $("#ask") && $("#ask").focus(), 30); return; }
  if (a === "sel"){ S.sel = el.dataset.m; if (S.view === "copiloto"){ S.view = "cabina"; } render(true); return; }
  if (a === "cur"){ S.cur = el.dataset.c; ls.set("cur", S.cur); render(true); return; }
  if (a === "donut"){ S.donut = el.dataset.d; render(true); return; }
  if (a === "fret"){ S.fRet = el.dataset.f; render(true); return; }
  if (a === "fgas"){ S.fGas = el.dataset.f; render(true); return; }
  if (a === "gascat"){ S.fGas = el.dataset.c; S.view = "gastos"; render(true); return; }
  if (a === "incl5"){ S.incl5 = !S.incl5; render(true); return; }
  if (a === "new"){ openForm(el.dataset.col); return; }

  if (a === "close"){ closeForm(); return; }
  if (a === "del"){
    if (!el.classList.contains("armed")){ el.classList.add("armed"); el.textContent = "¿Borrar?"; setTimeout(() => { if (el.isConnected && el.classList.contains("armed")){ el.classList.remove("armed"); el.innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>`; } }, 3500); return; }
    try { await remove(el.dataset.col, el.dataset.id); toast("Borrado"); } catch(e){ toast(errMsg(e), true); } return; }
  if (a === "fac"){ const r = S.retiros.find(x => x.id === el.dataset.id); if (!r) return; el.disabled = true;
    try { await patch("retiros", r.id, {facturado: !r.facturado}); if (!r.facturado && S.mode !== "demo") toast("Marcada como facturada"); } catch(e){ el.disabled = false; toast(errMsg(e), true); } return; }
  if (a === "cfac"){ const r = S.comisiones.find(x => x.id === el.dataset.id); if (!r) return; try { await patch("comisiones", r.id, {facturado: !r.facturado}); } catch(e){ toast(errMsg(e), true); } return; }
  if (a === "comp"){ try { await patch("comisiones", el.dataset.id, {compensado:true, compensadoFecha: NOW.toISOString().slice(0,10)}); toast("Marcado como compensado"); } catch(e){ toast(errMsg(e), true); } return; }
  if (a === "copy"){ const r = S.retiros.find(x => x.id === el.dataset.id); if (!r) return; const txt = `${r.cliente} — ${ddmm(r.fecha)}/${r.fecha.slice(0,4)} — $ ${nf2.format(+r.importe||0)}`;
    try { await navigator.clipboard.writeText(txt); toast("Copiado: " + txt); } catch(e){ toast(txt); } return; }
  if (a === "ask"){ const t = $("#ask"); if (t) t.value = el.dataset.q; ask(el.dataset.q); return; }
  if (a === "send"){ ask($("#ask").value); return; }
  if (a === "stop"){ S.ctl && S.ctl.abort(); return; }
  if (a === "exp"){ exportCSV(el.dataset.col); return; }
  if (a === "backup"){ download(`mayor-rossi-respaldo-${NOW.toISOString().slice(0,10)}.json`, JSON.stringify(snapshot(), null, 1), "application/json"); return; }
  if (a === "impNo"){ S.pendingImport = null; render(true); return; }
  if (a === "impOk"){ const d = S.pendingImport; S.pendingImport = null; S.retiros = d.retiros; S.gastos = d.gastos; S.comisiones = d.comisiones; if (d.config) S.config = d.config; S.sel = null; changed(); toast("Datos importados"); return; }

  if (a === "theme"){ const t = el.dataset.t; ls.set("theme", t); if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); render(true); return; }

  if (a === "selAll"){ const pend = S.retiros.filter(r => r.tipo !== "efectivo" && !r.facturado); const all = pend.every(r => SELF.has(r.id));

  if (a === "facLote"){ const n = SELF.size; S.retiros.forEach(r => { if (SELF.has(r.id)) r.facturado = true; }); SELF.clear(); changed(); toast(`${n} marcada${n>1?"s":""} como facturada${n>1?"s":""}`); return; }
  if (a === "sync"){ if (S.mode === "live" && S.sync !== "Guardado"){ dirty = true; setSync("Guardando…"); flush(); } return; }
  if (a === "demo"){ $("#gate").hidden = true; startDemo(); return; }
  if (a === "exitDemo"){ S.mode = "loading"; S.retiros = []; S.gastos = []; S.comisiones = []; S.config = null; boot(); return; }
  if (a === "addSaldo"){ const c = cfg(); saveCfg(Object.assign({}, c, {saldos:[...(c.saldos||[]), {nombre:"Nueva cuenta", importe:0}]})); return; }
  if (a === "rmSaldo"){ const c = cfg(); const s = (c.saldos||[]).slice(); s.splice(+el.dataset.i, 1); saveCfg(Object.assign({}, c, {saldos:s})); return; }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "qret"){ S.qRet = ev.target.value; $("#retBody").innerHTML = retRows(); }
  if (ev.target.id === "qgas"){ S.qGas = ev.target.value; $("#gasBody").innerHTML = gasRows(); }
});
document.addEventListener("keydown", ev => { if (ev.target.id === "ask" && ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); ask(ev.target.value); } });
document.addEventListener("change", ev => {
  const t = ev.target, c = cfg();
  if (t.dataset.fid){ if (t.checked) SELF.add(t.dataset.fid); else SELF.delete(t.dataset.fid); render(true); return; }
  if (t.dataset.fmonth){ S.retiros.filter(r => r.tipo !== "efectivo" && !r.facturado && ymOf(r.fecha) === t.dataset.fmonth).forEach(r => t.checked ? SELF.add(r.id) : SELF.delete(r.id)); render(true); return; }
  if (t.id === "impFile"){ const f = t.files && t.files[0]; if (!f) return;
    f.text().then(txt => { let o = JSON.parse(txt); if (o && o.data) o = o.data;
      const ok = o && ["retiros","gastos","comisiones"].every(k => Array.isArray(o[k]));
      if (!ok) throw new Error();
      const fix = (L, p) => L.map((r, i) => Object.assign({id: r.id || p + i + Date.now().toString(36)}, r));
      S.pendingImport = {retiros:fix(o.retiros,"r"), gastos:fix(o.gastos,"g"), comisiones:fix(o.comisiones,"c"), config:o.config || null}; render(true);
    }).catch(() => toast("Ese archivo no es un respaldo de Mayor Rossi.", true)); t.value = ""; return; }
  if (t.dataset.cfg){ const v = t.dataset.cfg === "objetivo" ? Math.max(0, +t.value || 0) : t.value; saveCfg(Object.assign({}, c, {[t.dataset.cfg]: v})); }
  else if (t.dataset.tc){ const tc = Object.assign({}, c.tcManual||{}); const v = +t.value; if (v > 0) tc[t.dataset.tc] = v; else delete tc[t.dataset.tc]; saveCfg(Object.assign({}, c, {tcManual:tc})); }
  else if (t.dataset.saldo !== undefined){ const s = (c.saldos||[]).map(x => Object.assign({}, x)); const i = +t.dataset.saldo; if (!s[i]) return; s[i][t.dataset.k] = t.dataset.k === "importe" ? (+t.value || 0) : t.value.trim(); saveCfg(Object.assign({}, c, {saldos:s})); }
});


/* ===================== arranque ===================== */
function startDemo(){
  if (S.mode === "demo") return;
  S.sync = "";
  const d = demoData(); S.retiros = d.R; S.gastos = d.G; S.comisiones = d.C; S.config = d.cfg; S.mode = "demo"; render(true);
}
function boot(){
  if (/^#?demo$/.test(location.hash) || /[?&]demo\b/.test(location.search)){ startDemo(); return; }
  let clave = ""; try { clave = localStorage.getItem(KEY) || ""; } catch(e){}
  if (!clave){ showGate(); return; }
  S.clave = clave;
  try { const c = JSON.parse(localStorage.getItem(CACHE) || "null"); if (c){ S.mode = "live"; S.sync = "Conectando…"; load(c); } } catch(e){}
  enter(clave).catch(e => { if (/Clave/.test(e.message)) logout("Tu clave cambió. Volvé a entrar."); else if (S.mode === "live"){ setSync("Sin conexión"); } else showGate(e.message); });
}
$("#gateForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const k = $("#gateKey").value.trim(); if (!k){ $("#gateErr").textContent = "Escribí tu clave."; return; }
  const b = $("#gateBtn"); b.disabled = true; b.textContent = "Entrando…"; $("#gateErr").textContent = "";
  try { await enter(k); $("#gateKey").value = ""; } catch(e){ $("#gateErr").textContent = e.message; }
  finally { b.disabled = false; b.textContent = "Entrar"; }
});
loadTC();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render(true)); } catch(e){}
addEventListener("scroll", () => $("#topbar").classList.toggle("scrolled", scrollY > 4), {passive:true});
addEventListener("beforeunload", e => { if (dirty || saving){ e.preventDefault(); e.returnValue = ""; } });
boot();
})();
</script>
</body>
