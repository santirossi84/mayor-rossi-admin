<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("mr:theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Santiago Rossi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/logo-smr-180.png">
<style>
/* Layout: lenguaje Nike — barra utilitaria gris, navegación horizontal blanca, título cartel en mayúsculas,
   bloque de campaña negro con el número gigante, tarjetas planas sobre gris, píldoras negras. */
:root{
  color-scheme: light;
  --bg:#FFFFFF; --card:#F5F5F5; --ink:#111111; --ink2:#39393B; --sec:#707072; --ter:#9E9EA0;
  --sep:#E5E5E5; --sep2:#CACACB; --fill:#F5F5F5; --fill2:#E5E5E5;
  --blue:#111111; --blue-ink:#111111; --green:#007D48; --green-f:#1EAA52; --orange:#111111; --orange-ink:#D30005;
  --red:#D30005; --red-f:#D30005; --purple:#0A7281; --indigo:#111111;
  --on-ink:#FFFFFF; --hero:#111111; --hero-ink:#FFFFFF; --hero-sec:#9E9EA0;
  --void:#FFFFFF; --ice:var(--ink); --mist:var(--sec); --dim:var(--ter); --prizm:var(--ink); --prizm-soft:#F5F5F5;
  --mustard:var(--ink); --crit:var(--red); --good:var(--green-f); --warn:#111111; --frost:#0A7281;
  --line:var(--sep); --line-hi:var(--sep2);
  --f:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fd:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fx:"Anton","Bebas Neue","Impact","Arial Narrow Bold",sans-serif;
  --r:0px; --rs:0px; --pill:30px; --gut:clamp(16px,3vw,48px);
  --shadow:none; --glass:#FFFFFF; --glass-edge:inset 0 -1px 0 #E5E5E5;
  --raised:#111111; --rail-bg:#FFFFFF; --top-bg:#F5F5F5; --sheet:#FFFFFF; --tcbg:transparent;
  --hover:#FAFAFA; --toast:#111111; --g:17,17,17;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#000000; --card:#161617; --ink:#FFFFFF; --ink2:#D4D4D6; --sec:#9E9EA0; --ter:#707072;
  --sep:#262628; --sep2:#3A3A3C; --fill:#1C1C1E; --fill2:#2A2A2C;
  --blue:#FFFFFF; --blue-ink:#FFFFFF; --green:#1EAA52; --green-f:#1EAA52; --orange:#FFFFFF; --orange-ink:#FF4D4F;
  --red:#FF4D4F; --red-f:#FF4D4F; --on-ink:#111111; --hero:#FFFFFF; --hero-ink:#111111; --hero-sec:#707072;
  --void:#161617; --prizm-soft:#1C1C1E; --rail-bg:#000000; --top-bg:#161617; --sheet:#111111; --hover:#121213;
  --toast:#FFFFFF; --g:255,255,255; --glass:#000000; --glass-edge:inset 0 -1px 0 #262628; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#000000; --card:#161617; --ink:#FFFFFF; --ink2:#D4D4D6; --sec:#9E9EA0; --ter:#707072;
  --sep:#262628; --sep2:#3A3A3C; --fill:#1C1C1E; --fill2:#2A2A2C;
  --blue:#FFFFFF; --blue-ink:#FFFFFF; --green:#1EAA52; --green-f:#1EAA52; --orange:#FFFFFF; --orange-ink:#FF4D4F;
  --red:#FF4D4F; --red-f:#FF4D4F; --on-ink:#111111; --hero:#FFFFFF; --hero-ink:#111111; --hero-sec:#707072;
  --void:#161617; --prizm-soft:#1C1C1E; --rail-bg:#000000; --top-bg:#161617; --sheet:#111111; --hover:#121213;
  --toast:#FFFFFF; --g:255,255,255; --glass:#000000; --glass-edge:inset 0 -1px 0 #262628; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.num,td.m,b{font-variant-numeric:tabular-nums}
.gate[hidden],[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra utilitaria + navegación ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.util{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-height:40px;padding:calc(4px + env(safe-area-inset-top,0px)) var(--gut) 4px;background:var(--top-bg);font-size:12px;font-weight:500}
.util .grow{flex:1}
.tcinfo{display:inline-flex;align-items:baseline;gap:6px;color:var(--ink)}
.tcinfo #tclbl,.tcinfo #tcsrc{color:var(--sec)}
.tcinfo b{font-size:13px;font-weight:600}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;height:64px;padding:0 var(--gut);background:var(--rail-bg);box-shadow:inset 0 -1px 0 var(--sep)}
.brandmark{display:flex;align-items:center;gap:10px;flex:none;color:var(--ink);text-decoration:none}
.brandmark img{display:block;height:40px;width:auto}
.brandmark span{font:400 22px/1 var(--fx);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.rail{flex:1;display:flex;justify-content:center;gap:0;min-width:0}
@media (max-width:1240px) and (min-width:901px){.rail button{font-size:15px;padding:0 8px}.rail button::after{left:8px;right:8px}}
.rail button{position:relative;display:inline-flex;align-items:center;gap:6px;height:64px;padding:0 10px;border:0;background:none;color:var(--ink);font-size:16px;font-weight:500;white-space:nowrap}
.rail button svg{display:none}
.rail button::after{content:"";position:absolute;left:12px;right:12px;bottom:14px;height:2px;background:var(--ink);transform:scaleX(0);transition:transform .2s}
.rail button:hover::after{transform:scaleX(.6)}
.rail button[aria-current="page"]::after{transform:scaleX(1)}
.rail button .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.rail button .badge:empty{display:none}
.nav .btn{flex:none}

.main{flex:1;min-width:0;width:100%;max-width:1440px;margin:0 auto;padding-inline:var(--gut);padding-block:0 64px}
.hud{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;padding-block:40px 20px}
.brand h1{margin:0;font:400 clamp(48px,8vw,112px)/.88 var(--fx);text-transform:uppercase;letter-spacing:-.005em;overflow-wrap:anywhere}
.brand p{margin:10px 0 0;color:var(--sec);font-size:16px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border:0;border-radius:var(--pill);background:var(--bg);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ter)}
.chip.live .dot{background:var(--green-f)}
.chip.busy .dot{background:var(--ink)}
.chip.bad{color:var(--red)}.chip.bad .dot{background:var(--red)}
.chip.demo .dot{background:var(--red)}
.seg{display:inline-flex;gap:4px}
.seg button{height:28px;padding:0 14px;border:1px solid var(--sep2);border-radius:var(--pill);background:var(--bg);font-size:12px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

/* meses: tira de filtros */
.scale{display:flex;gap:8px;overflow-x:auto;padding:4px 0 24px;scrollbar-width:none}
.scale::-webkit-scrollbar{display:none}
.scale button{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--sep2);border-radius:var(--pill);background:var(--bg);color:var(--ink);font-size:14px;font-weight:500}
.scale .alt{width:6px;height:18px;display:flex;align-items:flex-end;border-radius:3px;overflow:hidden;background:var(--fill2)}
.scale .alt b{display:block;width:100%;background:var(--ter)}
.scale .alt b.ok{background:var(--green-f)}.scale .alt b.low{background:var(--red)}
.scale span{text-transform:capitalize}
.scale button:hover{border-color:var(--ink)}
.scale button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.scale button[aria-pressed="true"] .alt{background:color-mix(in srgb,var(--on-ink) 30%,transparent)}
.scale .all .alt{display:none}
.scale .all span:first-child{display:none}

/* ---------- bloque de campaña ---------- */
.camp{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;margin-bottom:48px;padding:clamp(28px,4vw,56px);background:var(--hero);color:var(--hero-ink);overflow:hidden}
.camp .eyebrow{font-size:14px;font-weight:500;color:var(--hero-sec);margin-bottom:12px}
.camp h2{margin:0;font:400 clamp(44px,10.5vw,136px)/.88 var(--fx);text-transform:uppercase;letter-spacing:-.005em;overflow-wrap:anywhere}
.camp h2 em{font-style:normal;color:var(--hero-sec)}
.camp p{margin:16px 0 0;max-width:56ch;font-size:16px;color:var(--hero-sec)}
.camp .btn{background:var(--hero-ink);color:var(--hero)}
.camp .btn:hover{background:var(--hero-ink);opacity:.85}
.camp .stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:28px}
.camp .stats div{display:grid;gap:2px}
.camp .stats span{font-size:12px;color:var(--hero-sec)}
.camp .stats b{font-size:20px;font-weight:600}
@media (max-width:700px){.camp{grid-template-columns:minmax(0,1fr)}}

/* ---------- tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px}
.panel{position:relative;min-width:0;padding:24px;background:var(--card)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.ph h2{margin:0;font:500 20px/1.2 var(--fd);text-transform:uppercase;letter-spacing:.01em}
.ph .meta{font-size:14px;font-weight:500;color:var(--sec)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1180px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.big{font:400 56px/.95 var(--fx);letter-spacing:0}
.lbl{font-size:14px;font-weight:500;color:var(--sec)}
.sub{font-size:14px;color:var(--sec)}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--red)}.pz{color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;min-height:180px}
.kpi .v{font:400 48px/1 var(--fx);letter-spacing:0}
.kpi svg{width:100%;height:46px;display:block}
.kpi .foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:500;color:var(--sec)}
.kpi.link{cursor:pointer}
.kpi.link:hover{background:var(--fill2)}
@media (max-width:560px){.kpis{grid-template-columns:minmax(0,1fr)}}

.gauge-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
.gauge svg{width:100%;max-width:220px;display:block;margin-inline:auto}
.gstats{display:grid;gap:14px}
.gstats div{display:grid;gap:0}
.gstats b{font:400 30px/1.05 var(--fx)}
@media (max-width:560px){.gauge-wrap{grid-template-columns:minmax(0,1fr)}}

.chart svg{width:100%;height:auto;display:block}
.wide{min-width:560px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;font-weight:500;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed var(--ink);width:16px;vertical-align:4px;border-radius:0}

/* libro de retiros */
.libro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;align-items:start}
.lh{display:grid;gap:8px;padding:24px;background:var(--bg)}
.lh p{margin:0;font-size:15px;color:var(--ink2)}
.lh dl{display:grid;gap:10px;margin:8px 0 0;padding-top:14px;border-top:1px solid var(--sep2)}
.lh dl div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.lh dt{color:var(--sec)}.lh dd{margin:0;font-weight:600}
.lh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seal{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:var(--pill);background:var(--red);color:#fff;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.seal.ok{background:var(--green)}
table.lib tbody tr{cursor:pointer}
table.lib tr.sel td{background:var(--bg)}
table.lib tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
table.lib tr.now td:first-child::after{content:"EN CURSO";margin-left:8px;padding:2px 8px;border-radius:var(--pill);background:var(--ink);color:var(--on-ink);font-size:10px;font-weight:600;letter-spacing:.06em}
table.lib tfoot td{border-top:1px solid var(--ink);border-bottom:0;font-weight:700}
.dv{position:relative;display:block;height:6px;min-width:90px;background:var(--fill2)}
.dv::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink)}
.dv i{position:absolute;top:0;bottom:0}
.dv i.p{left:50%;background:var(--green-f)}.dv i.n{right:50%;background:var(--red)}
@media (max-width:900px){.libro{grid-template-columns:minmax(0,1fr)}}

.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
.donut svg{width:150px;height:150px}
.dl{display:grid;gap:9px;min-width:0}
.dl div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;font-weight:500}
.dl i{width:10px;height:10px;border-radius:50%}
.dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl b{font-size:13px;font-weight:500;color:var(--sec)}
@media (max-width:420px){.donut{grid-template-columns:minmax(0,1fr);justify-items:center}}

.signals{display:grid;gap:0}
.sig{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--sep2)}
.sig:first-child{border-top:0;padding-top:4px}
.sig .bar{width:10px;height:10px;border-radius:50%;background:var(--ter)}
.sig.warn .bar,.sig.crit .bar{background:var(--red)}.sig.ok .bar{background:var(--green-f)}.sig.info .bar{background:var(--ink)}
.sig p{margin:0;font-size:16px;font-weight:500;line-height:1.35}
.sig small{display:block;color:var(--sec);font-size:14px;font-weight:400;margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border:0;border-radius:var(--pill);background:var(--fill2);color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap;transition:transform .12s,opacity .12s,background .15s}
.btn:hover{background:var(--sep2)}
.btn:active{transform:scale(.96);opacity:.7}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.primary:hover{background:var(--ink2)}
.btn.ghost{background:none;padding:0 10px;text-decoration:underline;text-underline-offset:3px}
.btn.ghost:hover{background:none;opacity:.7}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel .btn:not(.primary):not(.ghost){background:var(--bg)}
.panel .btn:not(.primary):not(.ghost):hover{background:var(--fill2)}

.saldos{display:grid;gap:0}
.saldos div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--sep2);font-weight:500}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.rate div{display:grid;gap:2px}
.rate b{font:400 28px/1 var(--fx)}

.bar-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.bar-row .l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:40px;padding:0 18px;border:1px solid var(--sep2);border-radius:var(--pill);background:var(--bg);font-size:14px;font-weight:500;color:var(--ink)}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.search{height:40px;width:min(280px,100%);padding:0 18px;border:0;border-radius:24px;background:var(--bg);font-size:15px}
.search:focus{outline:none;box-shadow:0 0 0 2px var(--ink)}
.search::placeholder{color:var(--sec)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}
.strip .panel{padding:20px 24px}
.strip b{display:block;font:400 40px/1 var(--fx);margin-top:6px}
@media (max-width:820px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tw{position:relative;overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--sec);padding:10px;border-bottom:1px solid var(--ink);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td{padding:12px 10px;border-bottom:1px solid var(--sep2);vertical-align:middle}
tbody tr:hover td{background:var(--hover)}
td.r,th.r{text-align:right}
td.m{white-space:nowrap;font-weight:500}
td.d{color:var(--sec);white-space:nowrap;font-size:14px;font-weight:500}
td .note{display:block;font-size:13px;color:var(--sec);font-weight:400;margin-top:1px}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border:1px solid var(--sep2);border-radius:var(--pill);background:var(--bg);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:50%}
.tag.cash{border-color:var(--ink)}
.sw{position:relative;width:48px;height:28px;border:0;border-radius:999px;background:var(--sep2);padding:0;vertical-align:middle;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.3,.7,.3,1)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-ink)}
.sw-l{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--ink)}
.na{font-size:13px;color:var(--sec)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.ib{width:40px;height:40px;display:inline-grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--sec)}
.ib:hover{background:var(--fill2);color:var(--ink)}
.ib.armed{width:auto;padding:0 14px;border-radius:var(--pill);background:var(--red);color:#fff;font-size:13px;font-weight:600}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:36px 10px;text-align:center;color:var(--sec);font-size:15px}
.empty b{display:block;font:400 30px/1 var(--fx);text-transform:uppercase;color:var(--ink);margin-bottom:8px}

.rank{display:grid;gap:12px}
.rank div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;font-size:15px;font-weight:500}
.rank span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank b{font-weight:500;color:var(--sec)}
.rank em{grid-column:1/-1;height:4px;background:var(--fill2);overflow:hidden}
.rank em i{display:block;height:100%;background:var(--ink)}

.heat{display:grid;gap:2px;min-width:560px}
.heat .hr{display:grid;grid-template-columns:140px repeat(var(--n),minmax(48px,1fr));gap:2px;align-items:stretch}
.heat .hl{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;color:var(--ink)}
.heat .hl i{width:8px;height:8px;border-radius:50%}
.heat .hc{height:38px;display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--ink);background:var(--bg);border:2px solid transparent}
.heat .hc.sel{border-color:var(--ink)}
.heat .hh{font-size:11px;font-weight:600;color:var(--sec);text-align:center;text-transform:uppercase;letter-spacing:.04em}

.trail{position:relative;margin:40px 0 58px}
.trail .track{position:relative;height:10px;background:var(--bg);overflow:hidden}

/* ===================== constantes ===================== */

function loteBar(pend){

function factBars(rows, mx){

  const W = 760, H = 150, l = 56, r = 10, t = 8, b = 22, n = rows.length, bw = (W-l-r)/n, step = niceStep(mx/3), top = Math.ceil(mx/step)*step, y = v => t + (H-t-b) - v/top*(H-t-b);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Facturado y pendiente por mes">`;
  for (let v = 0; v <= top+1e-9; v += step) s += `<line x1="${l}" x2="${W-r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="rgba(${K.g},${v?.08:.3})"/><text x="${l-8}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="${K.ter}">${compact(v,"ARS")}</text>`;
  rows.forEach((o,i) => { const x = l + i*bw + bw*.22, w = bw*.56;
    s += `<rect x="${x.toFixed(1)}" y="${y(o.f).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(0)-y(o.f)).toFixed(1)}" fill="${K.ink}" opacity=".8"><title>${ymLong(o.m)} facturado ${ars(o.f)}</title></rect>`;
    if (o.p) s += `<rect x="${x.toFixed(1)}" y="${y(o.f+o.p).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(o.f)-y(o.f+o.p)).toFixed(1)}" fill="none" stroke="${K.ink}" stroke-dasharray="3 2"><title>${ymLong(o.m)} sin facturar ${ars(o.p)}</title></rect>`;
    s += `<text x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" fill="${K.sec}">${ymLabel(o.m).toUpperCase()}</text>`; });
  return s + `<text x="${W-r}" y="${t+8}" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="9.5" fill="${K.ink}">punteado = sin facturar</text></svg>`;
}

function carteraPanel(){
  const tc = usdHoy(), H = holdings();
  const inv = H.reduce((a,h) => a + h.px.v, 0), cost = H.reduce((a,h) => a + (+h.costo||0), 0), res = inv - cost;
  const Q = (S.cheques||[]).filter(q => !q.cobrado).sort((a,b) => a.vencimiento < b.vencimiento ? -1 : 1);
  const qNom = Q.reduce((a,q) => a + (+q.nominal||0), 0), qPag = Q.reduce((a,q) => a + (+q.pagado||0), 0);
  const tna = qPag ? Q.reduce((a,q) => a + chqTNA(q) * (+q.pagado||0), 0) / qPag : 0;
  const liq = (cfg().saldos||[]).reduce((a,x) => a + (+x.importe||0), 0) / tc;
  const ps = cuentaSaldo(), deuda = ps.USD + ps.ARS / tc, chq = qNom / tc;
  if (!H.length && !Q.length && !(S.cuenta||[]).length) return "";
  const neto = liq + inv + chq - deuda, act = liq + inv + chq;
  const segs = [["Líquido", liq, "var(--ter)"], ["Inversiones", inv, "var(--ink)"], ["Cheques", chq, "#0A7281"]].filter(x => x[1] > 0);
  const F = v => fUSD(v), next30 = Q.filter(q => daysTo(q.vencimiento) <= 30), n30 = next30.reduce((a,q) => a + (+q.nominal||0), 0);
  const best = H.filter(h => +h.costo > 0).map(h => [h, (h.px.v - h.costo) / h.costo]).sort((a,b) => b[1]-a[1]);
  const top = best[0], worst = best.length > 1 ? best[best.length-1] : null;
  const chqSem = (Q.reduce((a,q) => a + ((+q.nominal||0) - (+q.pagado||0)) * Math.min(1, 30 / chqDias(q)), 0)) / tc;
  const brokers = {}; H.forEach(h => brokers[h.broker] = (brokers[h.broker]||0) + h.px.v);
  const topB = Object.entries(brokers).sort((a,b) => b[1]-a[1])[0];
  return `<section class="panel s12" aria-labelledby="h-pat">

        ${act > 0 ? `<div class="alloc" role="img" aria-label="${esc(segs.map(x => x[0] + " " + pct(x[1]/act)).join(", "))}">${segs.map(x => `<i style="width:${(x[1]/act*100).toFixed(2)}%;background:${x[2]}"></i>`).join("")}</div>
        <div class="alloc-key">${segs.map(x => `<span><i style="background:${x[2]}"></i>${x[0]} <b>${pct(x[1]/act)}</b></span>`).join("")}${deuda > 0 ? `<span><i style="background:var(--red)"></i>Deuda <b>${pct(deuda/act)}</b></span>` : ""}</div>` : ""}
      </div>
      <div class="pat-cols">
        <button class="pat-col" data-act="view" data-v="inversiones"><span class="lbl">Inversiones</span><b>${F(inv)}</b>
          <span class="${res>=0?"pos":"neg"}">${res>=0?"+":"−"}${F(Math.abs(res))} · ${cost ? pct(res/cost,1) : "—"}</span>
          <small>${top ? `Mejor: ${esc(top[0].ticker)} ${pct(top[1],0)}` : "Sin posiciones"}${worst && worst[1] < 0 ? ` · peor: ${esc(worst[0].ticker)} ${pct(worst[1],0)}` : ""}${topB && inv ? `<br>${esc(topB[0])} concentra ${pct(topB[1]/inv)}` : ""}</small></button>
        <button class="pat-col" data-act="view" data-v="cheques"><span class="lbl">Cheques</span><b>${F(chq)}</b>

  if (!S.sel || (S.sel !== "all" && !ms.includes(S.sel))) S.sel = lastDataMonth();
  renderChrome(M, ms);

  v.innerHTML = S.view === "retiros" ? vRetiros(M, ms) : S.view === "gastos" ? vGastos(M, ms) : S.view === "arca" ? vArca(M, ms)
    : S.view === "comisiones" ? vComis(M, ms) : NOPER.includes(S.view) ? subTabs() + (S.view === "inversiones" ? vInversiones() : S.view === "cheques" ? vCheques() : vPapa())
    : S.view === "ajustes" ? vAjustes(ms) : vCabina(M, ms);

function toast(msg, bad){ const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.setAttribute("role","status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const errMsg = e => e && e.code === "quota_exceeded" ? "Se llenó el espacio del tablero; borrá registros viejos." : e && e.code === "invalid_argument" ? "No tenés permiso para guardar en este tablero." : "No se pudo guardar. Probá de nuevo.";
const listOf = col => S[col];
async function put(col, id, data){ const L = listOf(col); const i = L.findIndex(r => r.id === id); const rec = Object.assign({id}, data); if (i >= 0) L[i] = rec; else L.push(rec); changed(); }
async function patch(col, id, data){ const r = listOf(col).find(r => r.id === id); if (r) Object.assign(r, data); changed(); }
async function remove(col, id){ const L = listOf(col); const i = L.findIndex(r => r.id === id); if (i >= 0) L.splice(i, 1); changed(); }
async function saveCfg(next){ S.config = next; changed(); }

/* ===================== sincronización con la nube ===================== */
const API = "/api/datos", CACHE = "mayor_rossi_v1", KEY = "mayor_rossi_clave";
let saveT = null, saving = false, dirty = false;
const snapshot = () => ({retiros:S.retiros, gastos:S.gastos, comisiones:S.comisiones, inversiones:S.inversiones, cheques:S.cheques, cuenta:S.cuenta, cocos:S.cocos, config:S.config || DEF_CFG});
function cacheLocal(){ try { localStorage.setItem(CACHE, JSON.stringify({rev:S.rev, data:snapshot()})); } catch(e){} }
function setSync(t){ S.sync = t; const st = $("#status"); if (!st || S.mode !== "live") return;
  st.className = "chip " + (t === "Guardado" ? "live" : t === "Guardando…" ? "busy" : "bad"); st.lastElementChild.textContent = t; }
function api(method, body){ return fetch(API, {method, cache:"no-store", headers:{"content-type":"application/json","x-clave":S.clave}, body: body ? JSON.stringify(body) : undefined}); }
function changed(){ render(true); if (S.mode !== "live") return; cacheLocal(); dirty = true; setSync("Guardando…"); clearTimeout(saveT); saveT = setTimeout(flush, 700); }
async function flush(){
  if (saving){ clearTimeout(saveT); saveT = setTimeout(flush, 400); return; }
  if (!dirty || S.mode !== "live") return;
  saving = true; dirty = false;
  try {
    const r = await api("PUT", {rev:S.rev, data:snapshot()}); const j = await r.json().catch(() => ({}));
    if (r.status === 409){ load(j); setSync("Guardado"); toast("Había cambios desde otro dispositivo y se cargaron. Revisá tu último cambio.", true); }
    else if (r.status === 401){ dirty = true; logout("La clave cambió. Volvé a entrar."); }
    else if (!r.ok){ dirty = true; setSync("Sin guardar"); toast(j.error || "No se pudo guardar. Tocá el estado para reintentar.", true); }
    else { S.rev = j.rev; cacheLocal(); setSync(dirty ? "Guardando…" : "Guardado"); }
  } catch(e){ dirty = true; setSync("Sin guardar"); toast("Sin conexión. El cambio quedó en este dispositivo; tocá el estado para reintentar.", true); }
  finally { saving = false; if (dirty && S.sync === "Guardando…"){ clearTimeout(saveT); saveT = setTimeout(flush, 500); } }
}
function load(doc){
  const d = (doc && doc.data) || {};
  S.rev = +(doc && doc.rev) || 0;
  S.retiros = Array.isArray(d.retiros) ? d.retiros : []; S.gastos = Array.isArray(d.gastos) ? d.gastos : [];
  S.comisiones = Array.isArray(d.comisiones) ? d.comisiones : []; S.config = d.config || null;
  for (const k of ["inversiones","cheques","cuenta","cocos"]) S[k] = Array.isArray(d[k]) ? d[k] : [];
  cacheLocal(); render(true); loadPX();
}
function logout(msg){ try { localStorage.removeItem(KEY); localStorage.removeItem(CACHE); } catch(e){}
  S.clave = ""; S.mode = "loading"; S.retiros = []; S.gastos = []; S.comisiones = []; S.inversiones = []; S.cheques = []; S.cuenta = []; S.cocos = []; S.config = null; showGate(msg || ""); }
function showGate(msg){ $("#gate").hidden = false; $("#gateErr").textContent = msg || ""; setTimeout(() => $("#gateKey").focus(), 50); }
async function enter(clave){
  S.clave = clave;
  const r = await api("GET");
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error("Clave incorrecta.");
  if (!r.ok) throw new Error(j.error || "No se pudo conectar.");
  try { localStorage.setItem(KEY, clave); } catch(e){}
  S.mode = "live"; $("#gate").hidden = true;
  if (j.vacio) load({rev:0, data:{}}); else load(j);
  setSync("Guardado");
}
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

async function ask(q){
  q = (q||"").trim(); if (!q || S.chatBusy) return;
  const log = $("#log"); if (!log) return;
  if (!S.sample){ log.insertAdjacentHTML("beforeend", `<div class="msg sys">El copiloto no está disponible en esta vista.</div>`); return; }
  if (!S.chat.length) log.innerHTML = "";
  S.chat.push({role:"user", content:q});
  log.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div>`);
  const bub = document.createElement("div"); bub.className = "msg ai"; bub.textContent = "Pensando…"; log.appendChild(bub); log.scrollTop = log.scrollHeight;
  $("#ask").value = ""; S.chatBusy = true; $("#sendBtn").disabled = true; $("#stopBtn").hidden = false;
  const RULES = `Sos el copiloto financiero de Santi, que administra su sueldo retirando transferencias de clientes de la pinturería familiar. Respondé en español rioplatense, cercano y profesional, breve y concreto (máximo 180 palabras salvo que pida detalle). Expresá los análisis en USD usando el TC de cada mes, salvo temas impositivos (ARCA, Monotributo) que van en pesos. Usá solo los datos de abajo; si algo no está, decilo. No uses markdown con tablas; listas cortas con guiones están bien.\n\n${context()}`;
  S.ctl = new AbortController();
  try {
    const turns = [{role:"user", content:RULES}, ...S.chat.slice(-10)];
    const { text } = await S.sample(turns, {cache:false, signal:S.ctl.signal, onText:({text}) => { bub.textContent = text; log.scrollTop = log.scrollHeight; }});
    S.chat.push({role:"assistant", content:text});
  } catch(e){
    bub.textContent = e.text || "";
    const m = {not_granted:"No diste permiso para usar Claude desde este tablero.", rate_limited:"Muchas consultas seguidas. Probá en un rato.", sampling_disabled:"Claude no está disponible para esta cuenta.", session_expired:"Tu sesión venció: volvé a iniciar sesión.", cancelled:""}[e.code] ?? "Se cortó la respuesta. Probá de nuevo.";
    if (m) log.insertAdjacentHTML("beforeend", `<div class="msg sys">${esc(m)}</div>`);
    if (!e.text) S.chat.pop(); else S.chat.push({role:"assistant", content:e.text});
  } finally { S.chatBusy = false; const sb = $("#sendBtn"); if (sb){ sb.disabled = false; $("#stopBtn").hidden = true; } }
}

async function exportCSV(col){
  const L = listOf(col).slice().sort((a,b) => a.fecha < b.fecha ? -1 : 1);
  if (col === "cocos"){ const q = v => { v = v == null ? "" : String(v); return /[",;\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const L = (S.cocos||[]).slice().sort((a,b) => a.f < b.f ? -1 : 1);
    download(`santiago-rossi-cocos-${NOW.toISOString().slice(0,10)}.csv`, "\uFEFF" + ["fecha;operacion;instrumento;moneda;cantidad;precio;total", ...L.map(r => [r.f, r.op, r.ins, r.mon, String(r.q).replace(".",","), String(r.px).replace(".",","), String(r.tot).replace(".",",")].map(q).join(";"))].join("\n"), "text/csv;charset=utf-8"); return; }
  const cols = col === "inversiones" ? ["fecha","broker","tipo","ticker","cantidad","costo","precio","nota"] : col === "cheques" ? ["fecha","librador","pagado","nominal","vencimiento","cobrado","cobradoFecha","nota"] : col === "cuenta" ? ["fecha","tipo","concepto","moneda","importe","nota"] : col === "retiros" ? ["fecha","cliente","importe","tipo","facturado","nota"] : col === "gastos" ? ["fecha","concepto","importe","categoria","nota"] : ["fecha","cliente","importe","tasa","facturado","compensado","compensadoFecha","nota"];
  const q = v => { v = v === undefined || v === null ? "" : String(v); return /[",;\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv = "\uFEFF" + [cols.join(";"), ...L.map(r => cols.map(k => q(typeof r[k] === "number" ? String(r[k]).replace(".",",") : r[k])).join(";"))].join("\n");
  download(`santiago-rossi-${col}-${NOW.toISOString().slice(0,10)}.csv`, csv, "text/csv;charset=utf-8");
}

document.addEventListener("change", ev => {
  const t = ev.target, c = cfg();
  if (t.dataset.fid){ if (t.checked) SELF.add(t.dataset.fid); else SELF.delete(t.dataset.fid); render(true); return; }
  if (t.dataset.fmonth){ S.retiros.filter(r => r.tipo !== "efectivo" && !r.facturado && ymOf(r.fecha) === t.dataset.fmonth).forEach(r => t.checked ? SELF.add(r.id) : SELF.delete(r.id)); render(true); return; }
  if (t.id === "cocosFile"){ const fs = [...(t.files||[])]; if (!fs.length) return;
    Promise.all(fs.map(f => f.text())).then(txts => {
      const rows = []; let bad = 0; txts.forEach(x => { const r = parseCocos(x); if (r) rows.push(...r); else bad++; });
      if (!rows.length){ toast("Esos archivos no parecen el CSV de movimientos de Cocos.", true); return; }
      const have = new Set((S.cocos||[]).map(r => r.t)), seen = new Set(), nuevos = rows.filter(r => !have.has(r.t) && !seen.has(r.t) && seen.add(r.t));
      S.pendingCocos = nuevos; const fsr = rows.map(r => r.f).sort(), ops = {}; nuevos.forEach(r => ops[r.op] = (ops[r.op]||0) + 1);
      formOpener = $("[data-act=pickCocos]");
      $("#layer").innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
        <h3 id="dTitle">Movimientos de Cocos</h3><p class="sub" style="margin:0 0 18px">${fs.length} archivo${fs.length>1?"s":""} · ${rows.length} movimientos del ${ddmm(fsr[0])}/${fsr[0].slice(0,4)} al ${ddmm(fsr[fsr.length-1])}/${fsr[fsr.length-1].slice(0,4)}. ${nuevos.length} son nuevos${rows.length - nuevos.length ? ` y ${rows.length - nuevos.length} ya estaban cargados` : ""}.${bad ? ` ${bad} archivo no se pudo leer.` : ""}</p>
        <div class="catplan">${Object.entries(ops).sort((a,b) => b[1]-a[1]).map(([k,v]) => `<div class="cp-r"><span>${esc(k)}</span><small>${v}</small></div>`).join("") || `<div class="empty"><b>Nada nuevo</b>Todos estos movimientos ya estaban importados.</div>`}</div>
        <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancelar</button>${nuevos.length ? `<button type="button" class="btn primary" data-act="cocosOk">Importar ${nuevos.length}</button>` : ""}</div></aside>`;
    }).catch(() => toast("No se pudieron leer los archivos.", true)); t.value = ""; return; }
  if (t.id === "impFile"){ const f = t.files && t.files[0]; if (!f) return;
    f.text().then(txt => { let o = JSON.parse(txt); if (o && o.data) o = o.data;
      const ok = o && ["retiros","gastos","comisiones"].every(k => Array.isArray(o[k]));
      if (!ok) throw new Error();
      const fix = (L, p) => L.map((r, i) => Object.assign({id: r.id || p + i + Date.now().toString(36)}, r));
      const opt = (k, p) => Array.isArray(o[k]) ? fix(o[k], p) : (S[k] || []);
      S.pendingImport = {retiros:fix(o.retiros,"r"), gastos:fix(o.gastos,"g"), comisiones:fix(o.comisiones,"c"), inversiones:opt("inversiones","in"), cheques:opt("cheques","ch"), cuenta:opt("cuenta","cu"), cocos:Array.isArray(o.cocos) ? o.cocos : (S.cocos || []), config:o.config || null}; render(true);
    }).catch(() => toast("Ese archivo no es un respaldo de Santiago Rossi.", true)); t.value = ""; return; }
  if (t.dataset.cfg){ const v = t.dataset.cfg === "objetivo" ? Math.max(0, +t.value || 0) : t.value; saveCfg(Object.assign({}, c, {[t.dataset.cfg]: v})); }
  else if (t.dataset.tc){ const tc = Object.assign({}, c.tcManual||{}); const v = +t.value; if (v > 0) tc[t.dataset.tc] = v; else delete tc[t.dataset.tc]; saveCfg(Object.assign({}, c, {tcManual:tc})); }
  else if (t.dataset.saldo !== undefined){ const s = (c.saldos||[]).map(x => Object.assign({}, x)); const i = +t.dataset.saldo; if (!s[i]) return; s[i][t.dataset.k] = t.dataset.k === "importe" ? (+t.value || 0) : t.value.trim(); saveCfg(Object.assign({}, c, {saldos:s})); }
});


/* ===================== arranque ===================== */
function startDemo(){
  if (S.mode === "demo") return;
  S.sync = "";
  const d = demoData(); S.retiros = d.R; S.gastos = d.G; S.comisiones = d.C; S.inversiones = d.I; S.cheques = d.Q; S.cuenta = d.P; S.cocos = d.K; S.config = d.cfg; S.mode = "demo"; render(true); loadPX();
}
function boot(){
  if (/^#?demo$/.test(location.hash) || /[?&]demo\b/.test(location.search)){ startDemo(); return; }
  let clave = ""; try { clave = localStorage.getItem(KEY) || ""; } catch(e){}
  if (!clave){ showGate(); return; }
  S.clave = clave;
  try { const c = JSON.parse(localStorage.getItem(CACHE) || "null"); if (c){ S.mode = "live"; S.sync = "Conectando…"; load(c); } } catch(e){}
  enter(clave).catch(e => { if (/Clave/.test(e.message)) logout("Tu clave cambió. Volvé a entrar."); else if (S.mode === "live"){ setSync("Sin conexión"); } else showGate(e.message); });
}
$("#gateForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const k = $("#gateKey").value.trim(); if (!k){ $("#gateErr").textContent = "Escribí tu clave."; return; }
  const b = $("#gateBtn"); b.disabled = true; b.textContent = "Entrando…"; $("#gateErr").textContent = "";
  try { await enter(k); $("#gateKey").value = ""; } catch(e){ $("#gateErr").textContent = e.message; }
  finally { b.disabled = false; b.textContent = "Entrar"; }
});
loadTC();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render(true)); } catch(e){}
addEventListener("scroll", () => $("#topbar").classList.toggle("scrolled", scrollY > 4), {passive:true});
addEventListener("beforeunload", e => { if (dirty || saving){ e.preventDefault(); e.returnValue = ""; } });
boot();
})();
</script>
