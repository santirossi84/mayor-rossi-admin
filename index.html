      <div class="err" id="fErr"></div><div class="foot">${a === "ctaEdit" ? `<button type="button" class="btn ghost" data-act="ctaDel" data-id="${esc(c.id)}">${used ? "Quitar (tiene movimientos)" : "Quitar cuenta"}</button>` : `<button type="button" class="btn ghost" data-act="close">Cancelar</button>`}<button type="submit" class="btn primary">Guardar</button></div></form></aside>`;
    $("#ctaFrm").addEventListener("submit", e => { e.preventDefault(); const L = ctas().map(x => Object.assign({}, x));
      if (a === "ctaAj"){ const v = parseFloat(String($("#fSal").value).replace(",",".")); if (!isFinite(v)) return $("#fErr").textContent = "Cargá un número.";
        const x = L.find(y => y.id === c.id); x.inicial = (+x.inicial||0) + (v - cur); saveCtas(L); closeForm(); toast("Saldo ajustado"); return; }
      const nom = $("#fCn").value.trim(); if (!nom) return $("#fErr").textContent = "Poné un nombre.";
      if (a === "ctaNew"){ const v = parseFloat(String($("#fSal").value).replace(",",".")) || 0; L.push({id:newId("ct"), nombre:nom, moneda:$("#fCm").value, inicial:v}); }
      else { const x = L.find(y => y.id === c.id); x.nombre = nom; if (!used) x.moneda = $("#fCm").value; }
      saveCtas(L); closeForm(); toast("Cuenta guardada"); });
    setTimeout(() => ($("#fSal") || $("#fCn")).focus(), 30); return; }
  if (a === "ctaDel"){ if (!el.classList.contains("armed")){ el.classList.add("armed"); el.textContent = "¿Seguro? Tocá de nuevo"; return; }
    saveCtas(ctas().filter(x => x.id !== el.dataset.id)); closeForm(); toast("Cuenta quitada"); return; }
  if (a === "pickCocos"){ $("#cocosFile").click(); return; }
  if (a === "cocosOk"){ const n = S.pendingCocos || []; S.pendingCocos = null; S.cocos = [...(S.cocos||[]), ...n]; closeForm(); changed(); loadPX(true); toast(`${n.length} movimientos de Cocos importados`); return; }
  if (a === "cocosAj"){ const k = el.dataset.k, h = cocosPos().find(x => x.ticker === k); if (!h) return; formOpener = el;
    const sinIni = h.cantidad - h.q0;
    $("#layer").innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <h3 id="dTitle">Tenencia de ${esc(k)}</h3><p class="sub" style="margin:0 0 18px">${esc(h.nombre)}. Los movimientos del CSV suman ${nf2.format(sinIni)}; lo que tenías antes del primer movimiento no figura. Cargá cuánto tenés hoy según Cocos y se recalcula.</p>
      <form class="form" id="ajFrm"><div class="f"><label for="fAj">${h.tipo === "fci" ? "Cuotapartes" : "Cantidad"} que tenés hoy</label><input id="fAj" type="number" step="any" min="0" value="${+h.cantidad.toFixed(4)}" inputmode="decimal"></div>
      <div class="err" id="fErr"></div><div class="foot"><button type="button" class="btn ghost" data-act="ajAuto" data-k="${esc(k)}">Volver a la estimación</button><button type="submit" class="btn primary">Guardar</button></div></form></aside>`;
    $("#ajFrm").addEventListener("submit", e => { e.preventDefault(); const v = parseFloat(String($("#fAj").value).replace(",",".")); if (!isFinite(v) || v < 0) return $("#fErr").textContent = "Cargá una cantidad válida.";
      const aj = Object.assign({}, cfg().cocosAj || {}); aj[k] = Math.max(0, v - sinIni); S.config = Object.assign({}, cfg(), {cocosAj:aj}); closeForm(); changed(); toast("Tenencia actualizada"); });
    setTimeout(() => $("#fAj").focus(), 30); return; }
  if (a === "cocosRatio"){ const k = el.dataset.k, L = ratioOf(k); formOpener = el;
    $("#layer").innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <h3 id="dTitle">Cambio de ratio de ${esc(k)}</h3><p class="sub" style="margin:0 0 18px">Cuando Cocos cambia el ratio de un CEDEAR, cada unidad vieja pasa a ser varias nuevas y el precio baja en la misma proporción. Lo que pagaste no cambia: el costo se reparte entre las unidades nuevas. Se aplica a todos los movimientos anteriores a la fecha.</p>
      ${L.length ? `<div class="catplan" style="margin-bottom:14px">${L.map((e,i) => `<div class="cp-r"><span>×${esc(nf2.format(e.x).replace(/,00$/,""))} desde el ${ddmm(e.f)}/${e.f.slice(0,4)}</span><button type="button" class="btn ghost" data-act="ratioDel" data-k="${esc(k)}" data-i="${i}">Quitar</button></div>`).join("")}</div>` : ""}
      <form class="form" id="rxFrm"><div class="f"><label for="fRx">Cada unidad vieja pasó a ser</label><input id="fRx" type="number" step="any" min="0" inputmode="decimal" placeholder="3"></div>
      <div class="f"><label for="fRf">Desde el</label><input id="fRf" type="date" value="${NOW.toISOString().slice(0,10)}"><small>Alcanza con una fecha posterior a la última compra con el ratio viejo.</small></div>
      <div class="err" id="fErr"></div><div class="foot"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></form></aside>`;
    $("#rxFrm").addEventListener("submit", e => { e.preventDefault(); const x = parseFloat(String($("#fRx").value).replace(",",".")), f = $("#fRf").value;
      if (!isFinite(x) || x <= 0 || x === 1) return $("#fErr").textContent = "Cargá cuántas unidades nuevas es cada vieja (por ejemplo 3).";
      if (!okF(f)) return $("#fErr").textContent = "Elegí una fecha válida.";
      const R = Object.assign({}, cfg().cocosRatio || {}); R[k] = [...(R[k] || []), {f, x}]; S.config = Object.assign({}, cfg(), {cocosRatio:R}); closeForm(); changed(); toast(`Ratio de ${k} ×${nf2.format(x).replace(/,00$/,"")} desde el ${ddmm(f)}`); });
    setTimeout(() => $("#fRx").focus(), 30); return; }
  if (a === "ratioDel"){ const k = el.dataset.k, R = Object.assign({}, cfg().cocosRatio || {}), L = ratioOf(k); L.splice(+el.dataset.i, 1); if (L.length) R[k] = L; else delete R[k]; S.config = Object.assign({}, cfg(), {cocosRatio:R}); closeForm(); changed(); toast("Cambio de ratio quitado"); return; }
  if (a === "ajAuto"){ const aj = Object.assign({}, cfg().cocosAj || {}); delete aj[el.dataset.k]; S.config = Object.assign({}, cfg(), {cocosAj:aj}); closeForm(); changed(); return; }
  if (a === "portOk"){ const P = S.pendingPort; S.pendingPort = null; if (!P) return;
    /* el reporte pisa todo lo de Cocos: posiciones, ajustes viejos de tenencia y el disponible de las cuentas de Cocos */
    const c = Object.assign({}, cfg(), {carteraCocos:P}); delete c.cocosAj;
    const caja = portCajaCtas(P);
    if (caja.length){ const mv = ctaMovs(); c.cuentas = ctas().map(x => { const k = caja.find(y => y.id === x.id); if (!k) return Object.assign({}, x);
      const hasta = mv.filter(m => m.cta === x.id && m.fecha <= P.fecha).reduce((a,m) => a + m.monto, 0);
      return Object.assign({}, x, {inicial: Math.round((k.monto - hasta)*100)/100}); }); }
    S.config = c; closeForm(); changed(); loadPX(true);
    toast(`${P.filas.length} posiciones de Cocos al ${ddmm(P.fecha)}${caja.length ? " y saldo de " + caja.map(k => k.nombre).join(" y ") : ""}`); return; }
  if (a === "portQuitar"){ const c = Object.assign({}, cfg()); delete c.carteraCocos; S.config = c; changed(); toast("Las posiciones de Cocos vuelven a salir de los movimientos"); return; }
  if (a === "pxRefresh"){ loadPX(true); render(true); return; }
  if (a === "comp"){ try { await patch("comisiones", el.dataset.id, {compensado:true, compensadoFecha: NOW.toISOString().slice(0,10)}); toast("Marcado como compensado"); } catch(e){ toast(errMsg(e), true); } return; }
  if (a === "copy"){ const r = S.retiros.find(x => x.id === el.dataset.id); if (!r) return; const txt = `${r.cliente} — ${ddmm(r.fecha)}/${String(r.fecha||"").slice(0,4)} — $ ${nf2.format(+r.importe||0)}`;
    try { await navigator.clipboard.writeText(txt); toast("Copiado: " + txt); } catch(e){ toast(txt); } return; }
  if (a === "ask"){ const t = $("#ask"); if (t) t.value = el.dataset.q; ask(el.dataset.q); return; }
  if (a === "send"){ ask($("#ask").value); return; }
  if (a === "stop"){ S.ctl && S.ctl.abort(); return; }
  if (a === "exp"){ exportCSV(el.dataset.col); return; }
  if (a === "backup"){ download(`santiago-rossi-respaldo-${NOW.toISOString().slice(0,10)}.json`, JSON.stringify(snapshot(), null, 1), "application/json"); return; }
  if (a === "impNo"){ S.pendingImport = null; render(true); return; }
  if (a === "impOk"){ const d = S.pendingImport; S.pendingImport = null; download(`santiago-rossi-antes-de-importar-${NOW.toISOString().slice(0,10)}.json`, JSON.stringify(snapshot(), null, 1), "application/json"); forceNext = true; S.retiros = d.retiros; S.gastos = d.gastos; S.comisiones = d.comisiones; S.inversiones = d.inversiones; S.cheques = d.cheques; S.cuenta = d.cuenta; S.cocos = d.cocos; S.movs = d.movs; if (d.config) S.config = d.config; S.sel = null; changed(); toast("Datos importados"); return; }
  if (a === "logout"){ if (dirty && !confirm("Hay cambios que todavía no se guardaron en la nube. Si salís, se pierden. ¿Salir igual?")) return; logout(); return; }
  if (a === "theme"){ const t = el.dataset.t; ls.set("theme", t); if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); render(true); return; }
  if (a === "print"){ printResumen(); return; }
  if (a === "selAll"){ const pend = S.retiros.filter(r => r.tipo !== "efectivo" && !r.facturado); const all = pend.every(r => SELF.has(r.id));
    SELF.clear(); if (!all) pend.forEach(r => SELF.add(r.id)); render(true); return; }
  if (a === "copyLote"){ const sel = S.retiros.filter(r => SELF.has(r.id)).sort((x,y) => x.fecha < y.fecha ? -1 : 1);
    const txt = sel.map(r => `${ddmm(r.fecha)}/${String(r.fecha||"").slice(0,4)}\t${r.cliente}\t${nf2.format(+r.importe||0)}`).join("\n");
    try { await navigator.clipboard.writeText(txt); toast(`Copiadas ${sel.length} líneas`); } catch(e){ toast("No se pudo copiar.", true); } return; }
  if (a === "facLote"){ const n = SELF.size; S.retiros.forEach(r => { if (SELF.has(r.id)) r.facturado = true; }); SELF.clear(); changed(); toast(`${n} marcada${n>1?"s":""} como facturada${n>1?"s":""}`); return; }
  if (a === "sync"){
    if (pausada){ toast("La sincronización está pausada por el freno de emergencia. Recargá la página para reanudar; tus cambios están guardados en este dispositivo.", true); return; }
    if (S.mode === "live" && S.sync !== "Guardado"){ dirty = true; fallos = 0; setSync("Guardando…"); flush(); } return; }
  if (a === "demo"){ $("#gate").hidden = true; startDemo(); return; }
  if (a === "exitDemo"){ S.mode = "loading"; S.retiros = []; S.gastos = []; S.comisiones = []; S.inversiones = []; S.cheques = []; S.cuenta = []; S.cocos = []; S.movs = []; S.config = null; boot(); return; }
  if (a === "addSaldo"){ const c = cfg(); saveCfg(Object.assign({}, c, {saldos:[...(c.saldos||[]), {nombre:"Nueva cuenta", importe:0}]})); return; }
  if (a === "rmSaldo"){ const c = cfg(); const s = (c.saldos||[]).slice(); s.splice(+el.dataset.i, 1); saveCfg(Object.assign({}, c, {saldos:s})); return; }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "qret"){ S.qRet = ev.target.value; $("#retBody").innerHTML = retRows(); }
  if (ev.target.id === "qgas"){ S.qGas = ev.target.value; $("#gasBody").innerHTML = gasRows(); }
});
document.addEventListener("keydown", ev => { if (ev.target.id === "ask" && ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); ask(ev.target.value); } });
document.addEventListener("change", ev => {
  const t = ev.target, c = cfg();
  if (t.dataset.fid){ if (t.checked) SELF.add(t.dataset.fid); else SELF.delete(t.dataset.fid); render(true); return; }
  if (t.dataset.fmonth){ S.retiros.filter(r => r.tipo !== "efectivo" && !r.facturado && ymOf(r.fecha) === t.dataset.fmonth).forEach(r => t.checked ? SELF.add(r.id) : SELF.delete(r.id)); render(true); return; }
  if (t.id === "cocosFile"){ const fs = [...(t.files||[])]; if (!fs.length) return;
    Promise.all(fs.map(f => f.text())).then(txts => {
      const ports = txts.map(parsePortfolio).filter(Boolean).sort((a,b) => a.fecha < b.fecha ? 1 : -1);
      if (ports.length){ const P = ports[0], tot = P.filas.reduce((a,r) => a + portUSD(r), 0), mix = txts.length > ports.length; S.pendingPort = P; formOpener = $("[data-act=pickCocos]");
        $("#layer").innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
          <h3 id="dTitle">Tenencias de Cocos</h3><p class="sub" style="margin:0 0 18px">Reporte al ${ddmm(P.fecha)}/${P.fecha.slice(0,4)} · ${P.filas.length} posiciones por ${fmt(tot, "USD")} (pesos al oficial de hoy). Pisa las posiciones de Cocos, los ajustes de tenencia y el saldo de las cuentas de Cocos a esa fecha; lo que cargues después suma y resta desde ahí.${mix ? " Los archivos de movimientos importalos aparte." : ""}</p>
          ${P.filas.some(r => r.aviso) ? `<p class="sub" style="margin:-8px 0 14px;color:var(--red)">Cocos no tenía el precio del día de ${P.filas.filter(r => r.aviso).length} posición${P.filas.filter(r => r.aviso).length>1?"es":""}: ${P.filas.some(r => r.aviso === "sin precio") ? "sin precio vale cero hasta el próximo reporte" : "usó el último precio disponible"}.</p>` : ""}<div class="catplan">${P.filas.map(r => `<div class="cp-r"><span>${esc(cocosCode(r.ins))} · ${esc(TIPOL[portTipo(r.ins)])}${r.aviso ? ` · <b style="color:var(--red)">${esc(r.aviso)}</b>` : ""}</span><small>${esc(fmt(portUSD(r), "USD"))}</small></div>`).join("")}${portCajaCtas(P).map(k => `<div class="cp-r"><span>Disponible · pisa el saldo de ${esc(k.nombre)}</span><small>${esc(k.mon === "USD" ? fmt(k.monto,"USD") : ars(k.monto))}</small></div>`).join("")}</div>
          <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="button" class="btn primary" data-act="portOk">Usar estas tenencias</button></div></aside>`;
        return; }
      const rows = []; let bad = 0; txts.forEach(x => { const r = parseCocos(x); if (r) rows.push(...r); else bad++; });
      if (!rows.length){ toast("Esos archivos no parecen el CSV de movimientos de Cocos.", true); return; }
      const have = new Set((S.cocos||[]).map(r => r.t)), seen = new Set(), nuevos = rows.filter(r => !have.has(r.t) && !seen.has(r.t) && seen.add(r.t));
      S.pendingCocos = nuevos; const fsr = rows.map(r => r.f).sort(), ops = {}; nuevos.forEach(r => ops[r.op] = (ops[r.op]||0) + 1);
      formOpener = $("[data-act=pickCocos]");
      $("#layer").innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
        <h3 id="dTitle">Movimientos de Cocos</h3><p class="sub" style="margin:0 0 18px">${fs.length} archivo${fs.length>1?"s":""} · ${rows.length} movimientos del ${ddmm(fsr[0])}/${fsr[0].slice(0,4)} al ${ddmm(fsr[fsr.length-1])}/${fsr[fsr.length-1].slice(0,4)}. ${nuevos.length} son nuevos${rows.length - nuevos.length ? ` y ${rows.length - nuevos.length} ya estaban cargados` : ""}.${bad ? ` ${bad} archivo no se pudo leer.` : ""}</p>
        <div class="catplan">${Object.entries(ops).sort((a,b) => b[1]-a[1]).map(([k,v]) => `<div class="cp-r"><span>${esc(k)}</span><small>${v}</small></div>`).join("") || `<div class="empty"><b>Nada nuevo</b>Todos estos movimientos ya estaban importados.</div>`}</div>
        <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancelar</button>${nuevos.length ? `<button type="button" class="btn primary" data-act="cocosOk">Importar ${nuevos.length}</button>` : ""}</div></aside>`;
    }).catch(() => toast("No se pudieron leer los archivos.", true)); t.value = ""; return; }
  if (t.id === "impFile"){ const f = t.files && t.files[0]; if (!f) return;
    f.text().then(txt => { let o = JSON.parse(txt); if (o && o.data) o = o.data;
      const ok = o && ["retiros","gastos","comisiones"].every(k => Array.isArray(o[k]));
      if (!ok) throw new Error();
      const fix = (L, p) => L.map((r, i) => Object.assign({id: r.id || p + i + Date.now().toString(36)}, r));
      const opt = (k, p) => Array.isArray(o[k]) ? fix(o[k], p) : (S[k] || []);
      S.pendingImport = {retiros:fix(o.retiros,"r"), gastos:fix(o.gastos,"g"), comisiones:fix(o.comisiones,"c"), inversiones:opt("inversiones","in"), cheques:opt("cheques","ch"), cuenta:opt("cuenta","cu"), cocos:Array.isArray(o.cocos) ? o.cocos : (S.cocos || []), movs:opt("movs","mv"), config:o.config || null}; render(true);
    }).catch(() => toast("Ese archivo no es un respaldo de Santiago Rossi.", true)); t.value = ""; return; }
  if (t.dataset.cfg){ const v = t.dataset.cfg === "objetivo" ? Math.max(0, +t.value || 0) : t.value; saveCfg(Object.assign({}, c, {[t.dataset.cfg]: v})); }
  else if (t.dataset.tc){ const tc = Object.assign({}, c.tcManual||{}); const v = +t.value; if (v > 0) tc[t.dataset.tc] = v; else delete tc[t.dataset.tc]; saveCfg(Object.assign({}, c, {tcManual:tc})); }
  else if (t.dataset.saldo !== undefined){ const s = (c.saldos||[]).map(x => Object.assign({}, x)); const i = +t.dataset.saldo; if (!s[i]) return; s[i][t.dataset.k] = t.dataset.k === "importe" ? (+t.value || 0) : t.value.trim(); saveCfg(Object.assign({}, c, {saldos:s})); }
});


/* ===================== arranque ===================== */
function startDemo(){
  if (S.mode === "demo") return;
  S.sync = "";
  const d = demoData(); S.retiros = d.R; S.gastos = d.G; S.comisiones = d.C; S.inversiones = d.I; S.cheques = d.Q; S.cuenta = d.P; S.cocos = d.K; S.movs = d.V; S.config = d.cfg; S.mode = "demo"; render(true); loadPX();
}
function boot(){
  if (/^#?demo$/.test(location.hash) || /[?&]demo\b/.test(location.search)){ startDemo(); return; }
  let clave = ""; try { clave = localStorage.getItem(KEY) || ""; } catch(e){}
  if (!clave){ showGate(); return; }
  S.clave = clave;
  restoreCache();
  const reintentar = n => setTimeout(() => enter(clave).catch(e => { if (/Clave/.test(e.message)) logout("Tu clave cambió. Volvé a entrar.", dirty); else if (n < 8) reintentar(n + 1); }), Math.min(30000, 3000 * (n + 1)));
  enter(clave).catch(e => { if (/Clave/.test(e.message)) logout("Tu clave cambió. Volvé a entrar.", dirty); else if (S.mode === "live"){ setSync("Sin conexión"); reintentar(0); } else showGate(e.message); });
}
$("#gateForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const k = $("#gateKey").value.trim(); if (!k){ $("#gateErr").textContent = "Escribí tu clave."; return; }
  const b = $("#gateBtn"); b.disabled = true; b.textContent = "Entrando…"; $("#gateErr").textContent = "";
  try { await enter(k); $("#gateKey").value = ""; } catch(e){ $("#gateErr").textContent = e.message; }
  finally { b.disabled = false; b.textContent = "Entrar"; }
});
const railNav = document.querySelector(".rail");
if (railNav) railNav.addEventListener("scroll", railHints, {passive:true});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.mode !== "loading") railFocus(); });
loadTC();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render(true)); } catch(e){}
addEventListener("scroll", () => $("#topbar").classList.toggle("scrolled", scrollY > 4), {passive:true});
addEventListener("beforeunload", e => { if (dirty || saving){ e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refrescar(); });
addEventListener("focus", () => refrescar());
/* Al volver la conexión se reintenta una vez lo que quedó sin guardar (con 2 s de espera); el freno de emergencia sigue vigente. */
addEventListener("online", () => { if (pausada || S.mode !== "live") return; if (dirty){ fallos = 0; later(BACKOFF[0]); } else refrescar(); });
boot();
})();
</script>
